<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30-Day Weather Calendar</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf7ff;
      --bg-2: #f8fbff;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-solid: #ffffff;
      --text: #17324d;
      --muted: #60758b;
      --faint: #8ca0b3;
      --border: #d8e8f5;
      --accent: #1677c9;
      --accent-strong: #0d5da5;
      --mint: #dff8ed;
      --sun: #fff1bc;
      --warn: #fff2e2;
      --shadow: 0 18px 50px rgba(43, 107, 158, 0.14);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(237, 247, 255, 0.95)),
        radial-gradient(circle at top left, #ccecff 0, transparent 34rem),
        linear-gradient(135deg, #edf7ff 0%, #f7fbff 50%, #eef9f4 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px 14px 32px;
    }

    .app-header {
      display: grid;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .controls {
      display: grid;
      gap: 10px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
    }

    .search-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .search-input,
    .ghost-button,
    .refresh-button {
      min-height: 44px;
      border-radius: 8px;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      padding: 0 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.86);
      outline: none;
      transition: border 160ms ease, box-shadow 160ms ease;
    }

    .search-input:focus {
      border-color: rgba(22, 119, 201, 0.7);
      box-shadow: 0 0 0 4px rgba(22, 119, 201, 0.12);
    }

    .ghost-button,
    .refresh-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      color: var(--accent-strong);
      background: var(--panel-solid);
      border: 1px solid var(--border);
      font-weight: 800;
      white-space: nowrap;
    }

    .refresh-button {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 10px 22px rgba(22, 119, 201, 0.22);
    }

    .refresh-button:disabled,
    .ghost-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .suggestions {
      position: absolute;
      z-index: 5;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .suggestion {
      width: 100%;
      display: block;
      padding: 10px 12px;
      color: var(--text);
      background: #ffffff;
      text-align: left;
      border-bottom: 1px solid #edf4fb;
    }

    .suggestion:last-child {
      border-bottom: 0;
    }

    .suggestion:hover,
    .suggestion:focus {
      background: #eef7ff;
      outline: none;
    }

    .suggestion strong {
      display: block;
      font-size: 0.94rem;
    }

    .suggestion span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status {
      min-height: 32px;
      margin: 0 0 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .status.error {
      color: #a1431f;
    }

    .view-style-picker {
      display: grid;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 12px 34px rgba(43, 107, 158, 0.1);
    }

    .view-style-picker h2 {
      margin: 3px 0 0;
      font-size: clamp(1.08rem, 3vw, 1.35rem);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .view-buttons,
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-button,
    .chip {
      min-height: 38px;
      border-radius: 8px;
      padding: 0 12px;
      color: var(--accent-strong);
      background: #ffffff;
      border: 1px solid var(--border);
      font-weight: 900;
    }

    .view-button.is-active,
    .chip.is-active {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 8px 18px rgba(22, 119, 201, 0.18);
    }

    .feature-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .forecast-card {
      position: relative;
      overflow: hidden;
      min-height: 184px;
      padding: 18px;
      border: 1px solid rgba(216, 232, 245, 0.9);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(241, 249, 255, 0.88)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .forecast-card.tomorrow {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 251, 245, 0.9)),
        var(--panel);
    }

    .card-kicker,
    .month-note {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .card-date {
      margin-top: 6px;
      font-size: 1.04rem;
      font-weight: 800;
    }

    .card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0 16px;
    }

    .weather-icon {
      line-height: 1;
      font-size: 3.4rem;
      filter: drop-shadow(0 8px 14px rgba(42, 93, 130, 0.16));
    }

    .temps {
      text-align: right;
    }

    .temp-max {
      font-size: 2.25rem;
      line-height: 1;
      font-weight: 900;
    }

    .temp-min {
      margin-top: 4px;
      color: var(--muted);
      font-weight: 800;
    }

    .weather-label {
      color: var(--muted);
      font-weight: 800;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border-radius: 8px;
      background: rgba(237, 247, 255, 0.76);
      border: 1px solid rgba(216, 232, 245, 0.8);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      overflow-wrap: anywhere;
      font-size: 0.9rem;
    }

    .view-panel[hidden] {
      display: none;
    }

    .calendar-panel,
    .timeline-panel,
    .planner-panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow);
    }

    .calendar-header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.78);
    }

    .calendar-header h2 {
      margin: 3px 0 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .calendar-meta {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .weekday-grid,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday {
      padding: 10px 4px;
      color: var(--muted);
      background: #f5faff;
      border-bottom: 1px solid var(--border);
      font-size: clamp(0.68rem, 2.6vw, 0.86rem);
      font-weight: 900;
      text-align: center;
    }

    .day-cell {
      position: relative;
      min-width: 0;
      min-height: 108px;
      padding: 8px 6px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.78);
    }

    .day-cell:nth-child(7n) {
      border-right: 0;
    }

    .day-cell.is-today {
      background: linear-gradient(180deg, #fff9de, #ffffff 70%);
      box-shadow: inset 0 0 0 2px #f4bd38;
    }

    .day-cell.is-empty,
    .day-cell.is-outside {
      color: var(--faint);
      background: rgba(245, 249, 252, 0.64);
    }

    .day-cell.is-unavailable {
      color: #8aa0b2;
      background: rgba(247, 250, 253, 0.76);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      min-height: 24px;
    }

    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.86rem;
    }

    .is-today .day-number {
      color: #ffffff;
      background: #d18900;
    }

    .day-icon {
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      line-height: 1;
    }

    .day-label {
      margin-top: 6px;
      min-height: 28px;
      color: var(--muted);
      font-size: clamp(0.66rem, 2.3vw, 0.78rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .day-temps {
      margin-top: 8px;
      font-weight: 900;
      font-size: clamp(0.77rem, 2.7vw, 0.92rem);
      white-space: nowrap;
    }

    .day-details {
      display: grid;
      gap: 3px;
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(0.66rem, 2.4vw, 0.78rem);
      font-weight: 800;
    }

    .empty-copy {
      margin-top: 10px;
      color: var(--faint);
      font-size: clamp(0.62rem, 2.4vw, 0.78rem);
      font-weight: 800;
      line-height: 1.16;
    }

    .timeline-body,
    .planner-controls {
      padding: 14px;
    }

    .timeline-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(112px, 1fr);
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      scroll-snap-type: x proximity;
    }

    .timeline-day {
      display: grid;
      gap: 6px;
      min-height: 142px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: #ffffff;
      text-align: left;
      scroll-snap-align: start;
    }

    .timeline-day.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(22, 119, 201, 0.14);
    }

    .timeline-day.is-unavailable {
      color: var(--faint);
      background: #f6f9fc;
    }

    .timeline-date {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .timeline-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .timeline-temp {
      font-weight: 900;
    }

    .temp-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7f1f8;
    }

    .temp-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #49a7e8, #f2c84c);
    }

    .timeline-detail {
      display: grid;
      gap: 12px;
      margin-top: 4px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(239, 248, 255, 0.9)),
        #ffffff;
    }

    .timeline-detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .timeline-detail h3 {
      margin: 0;
      font-size: clamp(1.18rem, 4vw, 1.8rem);
      letter-spacing: 0;
    }

    .detail-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .planner-controls {
      display: grid;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(247, 251, 255, 0.72);
    }

    .sort-label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sort-select {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      font-weight: 800;
    }

    .planner-grid {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .planner-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #ffffff;
    }

    .planner-card.is-unavailable {
      color: var(--faint);
      background: #f6f9fc;
    }

    .planner-date {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 8px;
      background: #eef7ff;
      font-weight: 900;
    }

    .planner-date span {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      text-transform: uppercase;
    }

    .planner-main {
      min-width: 0;
    }

    .planner-main strong {
      display: block;
      font-size: 1rem;
    }

    .planner-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .planner-metrics span {
      padding: 5px 8px;
      border-radius: 999px;
      background: #edf7ff;
    }

    .empty-state {
      padding: 18px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    .loading-skeleton {
      position: relative;
      overflow: hidden;
      background: #eff7fd;
    }

    .loading-skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    @media (min-width: 720px) {
      .page {
        padding: 38px 24px 52px;
      }

      .app-header {
        grid-template-columns: 1fr minmax(360px, 430px);
      }

      .view-style-picker,
      .controls {
        justify-items: stretch;
      }

      .view-style-picker {
        grid-template-columns: 1fr auto;
        padding: 16px;
      }

      .feature-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .planner-controls {
        grid-template-columns: 1fr 190px;
        align-items: end;
      }

      .calendar-header {
        padding: 20px 22px;
      }

      .day-cell {
        min-height: 142px;
        padding: 11px;
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-inline: 9px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .calendar-panel,
      .timeline-panel,
      .planner-panel {
        border-radius: 0;
        margin-inline: -9px;
        border-left: 0;
        border-right: 0;
      }

      .calendar-header {
        padding-inline: 10px;
      }

      .day-cell {
        min-height: 98px;
        padding: 6px 4px;
      }

      .day-label {
        display: none;
      }

      .day-details {
        gap: 1px;
      }

      .empty-copy {
        margin-top: 8px;
      }

      .timeline-strip {
        grid-auto-columns: minmax(104px, 42vw);
      }

      .planner-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="app-header">
      <div class="title-block">
        <h1>30-Day Weather Calendar</h1>
        <p id="locationSummary">Eindhoven, Netherlands</p>
      </div>

      <section class="controls" aria-label="Weather controls">
        <div class="search-wrap">
          <label class="search-label" for="cityInput">Location</label>
          <div class="search-row">
            <input class="search-input" id="cityInput" type="search" placeholder="Search city" autocomplete="off" aria-autocomplete="list" aria-expanded="false">
            <button class="ghost-button" id="searchButton" type="button">Search</button>
          </div>
          <div class="suggestions" id="suggestions" hidden></div>
        </div>
        <button class="refresh-button" id="refreshButton" type="button">↻ Refresh</button>
      </section>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Loading forecast...</p>

    <section class="view-style-picker" aria-label="Presentation style">
      <div>
        <div class="month-note">View style</div>
        <h2>Choose your forecast layout</h2>
      </div>
      <div class="view-buttons" role="tablist" aria-label="Forecast presentation styles">
        <button class="view-button is-active" type="button" data-view="calendar" role="tab" aria-selected="true">Calendar</button>
        <button class="view-button" type="button" data-view="timeline" role="tab" aria-selected="false">Timeline</button>
        <button class="view-button" type="button" data-view="planner" role="tab" aria-selected="false">Planner</button>
      </div>
    </section>

    <section class="feature-grid" aria-label="Featured forecast cards">
      <article class="forecast-card" id="todayCard"></article>
      <article class="forecast-card tomorrow" id="tomorrowCard"></article>
    </section>

    <section class="calendar-panel view-panel" id="calendarPanel" data-view-panel="calendar" aria-label="Monthly weather calendar">
      <div class="calendar-header">
        <div>
          <div class="month-note">Calendar</div>
          <h2 id="monthTitle">Month</h2>
        </div>
        <div class="calendar-meta" id="calendarMeta">Forecast range unavailable</div>
      </div>
      <div class="weekday-grid" aria-hidden="true">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <section class="timeline-panel view-panel" id="timelinePanel" data-view-panel="timeline" aria-label="Interactive forecast timeline" hidden>
      <div class="calendar-header">
        <div>
          <div class="month-note">Timeline</div>
          <h2>Browse day by day</h2>
        </div>
        <div class="calendar-meta" id="timelineMeta">Select a day</div>
      </div>
      <div class="timeline-body">
        <div class="timeline-strip" id="timelineStrip" aria-label="Forecast days"></div>
        <article class="timeline-detail" id="timelineDetail"></article>
      </div>
    </section>

    <section class="planner-panel view-panel" id="plannerPanel" data-view-panel="planner" aria-label="Forecast planner" hidden>
      <div class="calendar-header">
        <div>
          <div class="month-note">Planner</div>
          <h2>Find useful weather windows</h2>
        </div>
        <div class="calendar-meta" id="plannerMeta">Filter and sort days</div>
      </div>
      <div class="planner-controls" aria-label="Planner filters">
        <div class="chip-group" id="plannerFilters">
          <button class="chip is-active" type="button" data-filter="all">All</button>
          <button class="chip" type="button" data-filter="rain">Rain likely</button>
          <button class="chip" type="button" data-filter="dry">Dry</button>
          <button class="chip" type="button" data-filter="wind">Windy</button>
          <button class="chip" type="button" data-filter="missing">No forecast</button>
        </div>
        <label class="sort-label" for="plannerSort">
          Sort
          <select id="plannerSort" class="sort-select">
            <option value="date">Date</option>
            <option value="rain">Rain chance</option>
            <option value="temp">Warmest</option>
            <option value="wind">Wind</option>
          </select>
        </label>
      </div>
      <div class="planner-grid" id="plannerGrid"></div>
    </section>
  </main>

  <script>
    const DEFAULT_LOCATION = {
      name: "Eindhoven",
      country: "Netherlands",
      admin1: "North Brabant",
      latitude: 51.471623,
      longitude: 5.466123,
      timezone: "Europe/Amsterdam"
    };

    const FORECAST_DAYS = 16;
    const STORAGE_KEY = "weather-calendar-location";
    const FORECAST_ENDPOINT = "https://api.open-meteo.com/v1/forecast";
    const GEOCODING_ENDPOINT = "https://geocoding-api.open-meteo.com/v1/search";

    const weatherCodes = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Dense drizzle", "🌧️"],
      56: ["Freezing drizzle", "🌧️"],
      57: ["Freezing drizzle", "🌧️"],
      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"],
      67: ["Freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"],
      73: ["Snow", "🌨️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],
      80: ["Rain showers", "🌦️"],
      81: ["Rain showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],
      85: ["Snow showers", "🌨️"],
      86: ["Snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm hail", "⛈️"],
      99: ["Thunderstorm hail", "⛈️"]
    };

    const els = {
      locationSummary: document.querySelector("#locationSummary"),
      cityInput: document.querySelector("#cityInput"),
      searchButton: document.querySelector("#searchButton"),
      suggestions: document.querySelector("#suggestions"),
      refreshButton: document.querySelector("#refreshButton"),
      status: document.querySelector("#status"),
      todayCard: document.querySelector("#todayCard"),
      tomorrowCard: document.querySelector("#tomorrowCard"),
      viewButtons: document.querySelectorAll(".view-button"),
      viewPanels: document.querySelectorAll(".view-panel"),
      monthTitle: document.querySelector("#monthTitle"),
      calendarMeta: document.querySelector("#calendarMeta"),
      calendarGrid: document.querySelector("#calendarGrid"),
      timelineMeta: document.querySelector("#timelineMeta"),
      timelineStrip: document.querySelector("#timelineStrip"),
      timelineDetail: document.querySelector("#timelineDetail"),
      plannerMeta: document.querySelector("#plannerMeta"),
      plannerFilters: document.querySelector("#plannerFilters"),
      plannerSort: document.querySelector("#plannerSort"),
      plannerGrid: document.querySelector("#plannerGrid")
    };

    let locationState = readSavedLocation();
    let forecastState = null;
    let searchResults = [];
    let searchTimer = null;
    let activeView = "calendar";
    let selectedTimelineKey = null;
    let plannerFilter = "all";
    let plannerSort = "date";

    init();

    function init() {
      els.cityInput.value = locationState.name;
      bindEvents();
      renderLoading();
      loadForecast();
    }

    function bindEvents() {
      els.refreshButton.addEventListener("click", () => loadForecast());
      els.searchButton.addEventListener("click", handleSearchSubmit);
      els.cityInput.addEventListener("input", handleSearchInput);
      els.cityInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          handleSearchSubmit();
        }
        if (event.key === "Escape") {
          hideSuggestions();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search-wrap")) {
          hideSuggestions();
        }
      });
      els.viewButtons.forEach((button) => {
        button.addEventListener("click", () => setActiveView(button.dataset.view));
      });
      els.plannerFilters.addEventListener("click", (event) => {
        const button = event.target.closest(".chip");
        if (!button) return;
        plannerFilter = button.dataset.filter;
        renderPlanner(getCurrentTodayKey());
      });
      els.plannerSort.addEventListener("change", () => {
        plannerSort = els.plannerSort.value;
        renderPlanner(getCurrentTodayKey());
      });
    }

    function setActiveView(view) {
      activeView = view;
      els.viewButtons.forEach((button) => {
        const isActive = button.dataset.view === view;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      els.viewPanels.forEach((panel) => {
        panel.hidden = panel.dataset.viewPanel !== view;
      });
    }

    function getCurrentTodayKey() {
      const timezone = forecastState?.timezone || locationState.timezone || DEFAULT_LOCATION.timezone;
      const todayParts = getDatePartsInTimeZone(new Date(), timezone);
      return toDateKey(todayParts.year, todayParts.month, todayParts.day);
    }

    function readSavedLocation() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.name && Number.isFinite(saved.latitude) && Number.isFinite(saved.longitude)) {
          return { ...DEFAULT_LOCATION, ...saved };
        }
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
      return { ...DEFAULT_LOCATION };
    }

    function saveLocation(location) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(location));
    }

    async function loadForecast() {
      setBusy(true);
      setStatus(`Loading forecast for ${formatLocation(locationState)}...`);
      hideSuggestions();

      try {
        const params = new URLSearchParams({
          latitude: locationState.latitude,
          longitude: locationState.longitude,
          daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,weather_code,wind_speed_10m_max",
          timezone: locationState.timezone || DEFAULT_LOCATION.timezone,
          forecast_days: FORECAST_DAYS
        });

        const response = await fetch(`${FORECAST_ENDPOINT}?${params}`);
        if (!response.ok) {
          throw new Error(`Forecast request failed with status ${response.status}`);
        }

        const forecast = await response.json();
        if (!forecast.daily || !Array.isArray(forecast.daily.time)) {
          throw new Error("Forecast response did not include daily data.");
        }

        forecastState = normalizeForecast(forecast);
        renderApp();
        setStatus(`Showing ${FORECAST_DAYS} available forecast days. Dates outside that range are left empty.`);
      } catch (error) {
        console.error(error);
        setStatus("Could not load the forecast. Please try refreshing or search for another city.", true);
        renderUnavailableShell();
      } finally {
        setBusy(false);
      }
    }

    function normalizeForecast(forecast) {
      const daily = forecast.daily;
      const byDate = new Map();
      daily.time.forEach((dateKey, index) => {
        byDate.set(dateKey, {
          dateKey,
          max: daily.temperature_2m_max?.[index],
          min: daily.temperature_2m_min?.[index],
          rainProbability: daily.precipitation_probability_max?.[index],
          precipitation: daily.precipitation_sum?.[index],
          code: daily.weather_code?.[index],
          wind: daily.wind_speed_10m_max?.[index]
        });
      });

      return {
        timezone: forecast.timezone || locationState.timezone || DEFAULT_LOCATION.timezone,
        byDate,
        startDate: daily.time[0],
        endDate: daily.time[daily.time.length - 1]
      };
    }

    function renderApp() {
      const timezone = forecastState.timezone;
      const todayParts = getDatePartsInTimeZone(new Date(), timezone);
      const todayKey = toDateKey(todayParts.year, todayParts.month, todayParts.day);
      const tomorrowKey = addDays(todayKey, 1);

      els.locationSummary.textContent = `${formatLocation(locationState)} · ${timezone}`;
      renderFeatureCard(els.todayCard, "Today", todayKey, forecastState.byDate.get(todayKey));
      renderFeatureCard(els.tomorrowCard, "Tomorrow", tomorrowKey, forecastState.byDate.get(tomorrowKey));
      renderCalendar(todayKey);
      renderTimeline(todayKey);
      renderPlanner(todayKey);
      setActiveView(activeView);
      els.calendarMeta.textContent = `Forecast available ${formatShortDate(forecastState.startDate)}–${formatShortDate(forecastState.endDate)}`;
    }

    function renderFeatureCard(card, label, dateKey, day) {
      if (!day) {
        card.innerHTML = `
          <div class="card-kicker">${label}</div>
          <div class="card-date">${formatLongDate(dateKey)}</div>
          <div class="card-main">
            <div>
              <div class="weather-icon" aria-hidden="true">—</div>
              <div class="weather-label">No forecast yet</div>
            </div>
          </div>
        `;
        return;
      }

      const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
      card.innerHTML = `
        <div class="card-kicker">${label}</div>
        <div class="card-date">${formatLongDate(dateKey)}</div>
        <div class="card-main">
          <div>
            <div class="weather-icon" aria-hidden="true">${icon}</div>
            <div class="weather-label">${weatherLabel}</div>
          </div>
          <div class="temps" aria-label="Temperature">
            <div class="temp-max">${formatTemperature(day.max)}</div>
            <div class="temp-min">${formatTemperature(day.min)} low</div>
          </div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>Rain</span><strong>${formatPercent(day.rainProbability)}</strong></div>
          <div class="metric"><span>Precip</span><strong>${formatMillimeters(day.precipitation)}</strong></div>
          <div class="metric"><span>Wind</span><strong>${formatWind(day.wind)}</strong></div>
        </div>
      `;
    }

    function renderCalendar(todayKey) {
      const calendarStartKey = getSundayStart(todayKey);
      const visibleDays = 30;
      const totalCells = Math.ceil(visibleDays / 7) * 7;

      els.monthTitle.textContent = formatRangeTitle(calendarStartKey, addDays(calendarStartKey, visibleDays - 1));
      els.calendarGrid.innerHTML = "";

      for (let cell = 0; cell < totalCells; cell += 1) {
        const isOutside = cell >= visibleDays;
        const cellEl = document.createElement("article");
        cellEl.className = "day-cell";

        if (isOutside) {
          cellEl.classList.add("is-outside");
          cellEl.setAttribute("aria-label", "Outside current month");
          cellEl.innerHTML = `<div class="empty-copy"> </div>`;
          els.calendarGrid.appendChild(cellEl);
          continue;
        }

        const dateKey = addDays(calendarStartKey, cell);
        const dayNumber = Number(dateKey.slice(-2));
        const day = forecastState.byDate.get(dateKey);
        const isToday = dateKey === todayKey;
        if (isToday) cellEl.classList.add("is-today");

        if (day) {
          const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
          cellEl.setAttribute("aria-label", `${formatLongDate(dateKey)}: ${weatherLabel}`);
          cellEl.innerHTML = `
            <div class="day-top">
              <span class="day-number">${dayNumber}</span>
              <span class="day-icon" aria-hidden="true">${icon}</span>
            </div>
            <div class="day-label">${weatherLabel}</div>
            <div class="day-temps">${formatTemperature(day.max)} / ${formatTemperature(day.min)}</div>
            <div class="day-details">
              <span>${formatPercent(day.rainProbability)} rain</span>
              <span>${formatMillimeters(day.precipitation)}</span>
            </div>
          `;
        } else {
          cellEl.classList.add("is-unavailable");
          cellEl.setAttribute("aria-label", `${formatLongDate(dateKey)}: No forecast yet`);
          cellEl.innerHTML = `
            <div class="day-top">
              <span class="day-number">${dayNumber}</span>
            </div>
            <div class="empty-copy">No forecast yet</div>
          `;
        }

        els.calendarGrid.appendChild(cellEl);
      }
    }

    function renderTimeline(todayKey) {
      const days = getDisplayDays(todayKey);
      const availableTemps = days
        .filter((entry) => entry.day && Number.isFinite(entry.day.max))
        .map((entry) => entry.day.max);
      const minTemp = Math.min(...availableTemps, 0);
      const maxTemp = Math.max(...availableTemps, 1);

      if (!selectedTimelineKey || !days.some((entry) => entry.dateKey === selectedTimelineKey)) {
        selectedTimelineKey = todayKey;
      }

      els.timelineMeta.textContent = `${days.filter((entry) => entry.day).length} forecast days, ${days.filter((entry) => !entry.day).length} empty days`;
      els.timelineStrip.innerHTML = days.map((entry) => {
        const day = entry.day;
        const isSelected = entry.dateKey === selectedTimelineKey;
        const date = getDateParts(entry.dateKey);
        const [weatherLabel, icon] = day ? weatherCodes[day.code] || ["Unknown", "❔"] : ["No forecast yet", "—"];
        const tempWidth = day && Number.isFinite(day.max)
          ? Math.max(8, Math.round(((day.max - minTemp) / Math.max(1, maxTemp - minTemp)) * 100))
          : 0;

        return `
          <button class="timeline-day ${isSelected ? "is-selected" : ""} ${day ? "" : "is-unavailable"}" type="button" data-date="${entry.dateKey}">
            <span class="timeline-date">${formatCompactWeekday(entry.dateKey)} ${date.day}</span>
            <span class="timeline-icon" aria-hidden="true">${icon}</span>
            <span class="timeline-temp">${day ? `${formatTemperature(day.max)} / ${formatTemperature(day.min)}` : "No forecast"}</span>
            <span>${weatherLabel}</span>
            <span class="temp-track" aria-hidden="true"><span class="temp-fill" style="width: ${tempWidth}%;"></span></span>
          </button>
        `;
      }).join("");

      els.timelineStrip.querySelectorAll(".timeline-day").forEach((button) => {
        button.addEventListener("click", () => {
          selectedTimelineKey = button.dataset.date;
          renderTimeline(todayKey);
        });
      });

      renderTimelineDetail(selectedTimelineKey, forecastState.byDate.get(selectedTimelineKey));
    }

    function renderTimelineDetail(dateKey, day) {
      if (!day) {
        els.timelineDetail.innerHTML = `
          <div class="timeline-detail-top">
            <div>
              <div class="card-kicker">${formatCompactWeekday(dateKey)}</div>
              <h3>${formatLongDate(dateKey)}</h3>
              <div class="weather-label">No forecast yet</div>
            </div>
            <div class="detail-icon" aria-hidden="true">—</div>
          </div>
          <div class="empty-copy">Open-Meteo only provides the available forecast range here, so this day stays intentionally empty.</div>
        `;
        return;
      }

      const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
      els.timelineDetail.innerHTML = `
        <div class="timeline-detail-top">
          <div>
            <div class="card-kicker">${formatCompactWeekday(dateKey)}</div>
            <h3>${formatLongDate(dateKey)}</h3>
            <div class="weather-label">${weatherLabel}</div>
          </div>
          <div class="detail-icon" aria-hidden="true">${icon}</div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>High</span><strong>${formatTemperature(day.max)}</strong></div>
          <div class="metric"><span>Low</span><strong>${formatTemperature(day.min)}</strong></div>
          <div class="metric"><span>Rain</span><strong>${formatPercent(day.rainProbability)}</strong></div>
          <div class="metric"><span>Precip</span><strong>${formatMillimeters(day.precipitation)}</strong></div>
          <div class="metric"><span>Wind</span><strong>${formatWind(day.wind)}</strong></div>
        </div>
      `;
    }

    function renderPlanner(todayKey) {
      const days = getDisplayDays(todayKey);
      const filteredDays = days.filter((entry) => plannerMatches(entry));
      const sortedDays = sortPlannerDays(filteredDays);

      els.plannerFilters.querySelectorAll(".chip").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === plannerFilter);
      });
      els.plannerSort.value = plannerSort;
      els.plannerMeta.textContent = `${sortedDays.length} of ${days.length} days shown`;

      if (!sortedDays.length) {
        els.plannerGrid.innerHTML = `<div class="empty-state">No days match this filter.</div>`;
        return;
      }

      els.plannerGrid.innerHTML = sortedDays.map((entry) => {
        const date = getDateParts(entry.dateKey);
        const day = entry.day;
        if (!day) {
          return `
            <article class="planner-card is-unavailable">
              <div class="planner-date"><span>${formatCompactWeekday(entry.dateKey)}</span>${date.day}</div>
              <div class="planner-main">
                <strong>${formatShortDate(entry.dateKey)}</strong>
                <div class="weather-label">No forecast yet</div>
              </div>
            </article>
          `;
        }

        const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
        return `
          <article class="planner-card">
            <div class="planner-date"><span>${formatCompactWeekday(entry.dateKey)}</span>${date.day}</div>
            <div class="planner-main">
              <strong>${icon} ${formatShortDate(entry.dateKey)} · ${weatherLabel}</strong>
              <div class="planner-metrics">
                <span>${formatTemperature(day.max)} / ${formatTemperature(day.min)}</span>
                <span>${formatPercent(day.rainProbability)} rain</span>
                <span>${formatMillimeters(day.precipitation)}</span>
                <span>${formatWind(day.wind)}</span>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function getDisplayDays(todayKey) {
      const calendarStartKey = getSundayStart(todayKey);
      return Array.from({ length: 30 }, (_, index) => {
        const dateKey = addDays(calendarStartKey, index);
        return {
          dateKey,
          day: forecastState.byDate.get(dateKey)
        };
      });
    }

    function plannerMatches(entry) {
      if (plannerFilter === "all") return true;
      if (plannerFilter === "missing") return !entry.day;
      if (!entry.day) return false;
      if (plannerFilter === "rain") return Number(entry.day.rainProbability) >= 50 || Number(entry.day.precipitation) >= 2;
      if (plannerFilter === "dry") return Number(entry.day.rainProbability) < 30 && Number(entry.day.precipitation) < 1;
      if (plannerFilter === "wind") return Number(entry.day.wind) >= 25;
      return true;
    }

    function sortPlannerDays(days) {
      return [...days].sort((a, b) => {
        if (plannerSort === "rain") return metricValue(b.day, "rainProbability") - metricValue(a.day, "rainProbability");
        if (plannerSort === "temp") return metricValue(b.day, "max") - metricValue(a.day, "max");
        if (plannerSort === "wind") return metricValue(b.day, "wind") - metricValue(a.day, "wind");
        return a.dateKey.localeCompare(b.dateKey);
      });
    }

    function metricValue(day, key) {
      return day && Number.isFinite(day[key]) ? day[key] : -Infinity;
    }

    function renderLoading() {
      els.todayCard.innerHTML = `<div class="loading-skeleton" style="height: 148px; border-radius: 8px;"></div>`;
      els.tomorrowCard.innerHTML = `<div class="loading-skeleton" style="height: 148px; border-radius: 8px;"></div>`;
      els.monthTitle.textContent = "Loading";
      els.calendarMeta.textContent = "Fetching daily forecast";
      els.calendarGrid.innerHTML = Array.from({ length: 35 }, () => `<div class="day-cell is-empty"><div class="loading-skeleton" style="height: 72px; border-radius: 8px;"></div></div>`).join("");
      els.timelineMeta.textContent = "Fetching daily forecast";
      els.timelineStrip.innerHTML = Array.from({ length: 8 }, () => `<div class="timeline-day loading-skeleton"></div>`).join("");
      els.timelineDetail.innerHTML = `<div class="loading-skeleton" style="height: 120px; border-radius: 8px;"></div>`;
      els.plannerMeta.textContent = "Fetching daily forecast";
      els.plannerGrid.innerHTML = Array.from({ length: 4 }, () => `<div class="planner-card loading-skeleton" style="height: 78px;"></div>`).join("");
    }

    function renderUnavailableShell() {
      const timezone = locationState.timezone || DEFAULT_LOCATION.timezone;
      const todayParts = getDatePartsInTimeZone(new Date(), timezone);
      forecastState = { timezone, byDate: new Map(), startDate: null, endDate: null };
      renderFeatureCard(els.todayCard, "Today", toDateKey(todayParts.year, todayParts.month, todayParts.day));
      renderFeatureCard(els.tomorrowCard, "Tomorrow", addDays(toDateKey(todayParts.year, todayParts.month, todayParts.day), 1));
      renderCalendar(toDateKey(todayParts.year, todayParts.month, todayParts.day));
      renderTimeline(toDateKey(todayParts.year, todayParts.month, todayParts.day));
      renderPlanner(toDateKey(todayParts.year, todayParts.month, todayParts.day));
      els.calendarMeta.textContent = "Forecast unavailable";
      els.timelineMeta.textContent = "Forecast unavailable";
      els.plannerMeta.textContent = "Forecast unavailable";
    }

    async function handleSearchInput() {
      const query = els.cityInput.value.trim();
      clearTimeout(searchTimer);
      if (query.length < 2) {
        hideSuggestions();
        return;
      }

      searchTimer = setTimeout(async () => {
        try {
          const params = new URLSearchParams({
            name: query,
            count: 5,
            language: "en",
            format: "json"
          });
          const response = await fetch(`${GEOCODING_ENDPOINT}?${params}`);
          if (!response.ok) throw new Error("Geocoding failed");
          const data = await response.json();
          searchResults = data.results || [];
          renderSuggestions(searchResults);
        } catch (error) {
          console.error(error);
          searchResults = [];
          hideSuggestions();
        }
      }, 300);
    }

    async function handleSearchSubmit() {
      const query = els.cityInput.value.trim();
      if (!query) return;

      if (searchResults.length > 0) {
        selectLocation(searchResults[0]);
        return;
      }

      setBusy(true);
      setStatus(`Searching for ${query}...`);
      try {
        const params = new URLSearchParams({
          name: query,
          count: 5,
          language: "en",
          format: "json"
        });
        const response = await fetch(`${GEOCODING_ENDPOINT}?${params}`);
        if (!response.ok) throw new Error("Geocoding failed");
        const data = await response.json();
        searchResults = data.results || [];
        if (!searchResults.length) {
          setStatus("No matching city found. Try a more specific location.", true);
          return;
        }
        selectLocation(searchResults[0]);
      } catch (error) {
        console.error(error);
        setStatus("Could not search for that city. Please try again.", true);
      } finally {
        setBusy(false);
      }
    }

    function renderSuggestions(results) {
      if (!results.length) {
        hideSuggestions();
        return;
      }

      els.suggestions.innerHTML = results.map((result, index) => `
        <button class="suggestion" type="button" data-index="${index}">
          <strong>${escapeHtml(result.name)}</strong>
          <span>${escapeHtml(formatGeoDetail(result))}</span>
        </button>
      `).join("");

      els.suggestions.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          selectLocation(searchResults[index]);
        });
      });

      els.suggestions.hidden = false;
      els.cityInput.setAttribute("aria-expanded", "true");
    }

    function selectLocation(result) {
      locationState = {
        name: result.name,
        country: result.country || "",
        admin1: result.admin1 || "",
        latitude: result.latitude,
        longitude: result.longitude,
        timezone: result.timezone || DEFAULT_LOCATION.timezone
      };
      saveLocation(locationState);
      els.cityInput.value = locationState.name;
      searchResults = [];
      hideSuggestions();
      renderLoading();
      loadForecast();
    }

    function hideSuggestions() {
      els.suggestions.hidden = true;
      els.suggestions.innerHTML = "";
      els.cityInput.setAttribute("aria-expanded", "false");
    }

    function setBusy(isBusy) {
      els.refreshButton.disabled = isBusy;
      els.searchButton.disabled = isBusy;
      els.refreshButton.textContent = isBusy ? "Loading..." : "↻ Refresh";
    }

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function getDatePartsInTimeZone(date, timezone) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: timezone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const partMap = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return {
        year: Number(partMap.year),
        month: Number(partMap.month),
        day: Number(partMap.day)
      };
    }

    function toDateKey(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function addDays(dateKey, amount) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day + amount));
      return toDateKey(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate());
    }

    function getDateParts(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return { year, month, day };
    }

    function getSundayStart(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const weekday = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
      return addDays(dateKey, -weekday);
    }

    function formatLongDate(dateKey) {
      if (!dateKey) return "";
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function formatCompactWeekday(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        weekday: "short",
        timeZone: "UTC"
      });
    }

    function formatShortDate(dateKey) {
      if (!dateKey) return "unknown";
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        timeZone: "UTC"
      });
    }

    function formatRangeTitle(startKey, endKey) {
      const [startYear, startMonth, startDay] = startKey.split("-").map(Number);
      const [endYear, endMonth, endDay] = endKey.split("-").map(Number);
      const startDate = new Date(Date.UTC(startYear, startMonth - 1, startDay));
      const endDate = new Date(Date.UTC(endYear, endMonth - 1, endDay));

      if (startYear === endYear && startMonth === endMonth) {
        return startDate.toLocaleDateString("en-US", {
          month: "long",
          year: "numeric",
          timeZone: "UTC"
        });
      }

      const startMonthName = startDate.toLocaleDateString("en-US", {
        month: "long",
        timeZone: "UTC"
      });
      const endLabel = endDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });
      return `${startMonthName}–${endLabel}`;
    }

    function formatTemperature(value) {
      return Number.isFinite(value) ? `${Math.round(value)}°C` : "—";
    }

    function formatPercent(value) {
      return Number.isFinite(value) ? `${Math.round(value)}%` : "—";
    }

    function formatMillimeters(value) {
      return Number.isFinite(value) ? `${Number(value).toFixed(value >= 10 ? 0 : 1)} mm` : "—";
    }

    function formatWind(value) {
      return Number.isFinite(value) ? `${Math.round(value)} km/h` : "—";
    }

    function formatLocation(location) {
      return [location.name, location.country].filter(Boolean).join(", ");
    }

    function formatGeoDetail(result) {
      return [result.admin1, result.country, result.timezone].filter(Boolean).join(" · ");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
