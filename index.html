<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30-Day Weather Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;

      /* Cyber-Glass palette (ported from Timer.html) */
      --bg-dark: #0b0d13;
      --glass-bg: rgba(24, 28, 38, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-rgb: 0, 243, 255;       /* set by body[data-weather]; drives every accent + glow */
      --accent-text: var(--neon-blue);
      --accent-contrast: #000000;
      --neon-green: #00ff9d;
      --neon-red: #ff0055;
      --neon-blue: rgb(var(--accent-rgb));
      --neon-yellow: #ffe600;
      --neon-purple: #bd00ff;
      --input-bg: rgba(255, 255, 255, 0.04);
      --font-display: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      /* Semantic tokens mapped onto the cyber-glass palette */
      --bg: var(--bg-dark);
      --bg-2: #10131b;
      --panel: var(--glass-bg);
      --panel-solid: #161a24;
      --text: #eef1f7;
      --text-primary: #f5f7fc;
      --muted: #8899a6;
      --text-muted: #8899a6;
      --faint: #5b6675;
      --border: var(--glass-border);
      --accent: var(--neon-blue);
      --accent-strong: var(--neon-blue);
      --accent-soft: rgba(var(--accent-rgb),0.08);
      --accent-soft-border: rgba(var(--accent-rgb),0.35);
      --mint: rgba(0, 255, 157, 0.1);
      --sun: rgba(255, 230, 0, 0.12);
      --warn: rgba(255, 0, 85, 0.1);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      --glow-a: 76, 29, 149;            /* background glow colors; set by body[data-weather] */
      --glow-b: 14, 165, 233;
      --glow-strength: 0.1;
      --wash-a: 255, 206, 140;
      --wash-b: 255, 184, 158;
      --wash-strength: 0.55;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-pill: 999px;
      font-family: var(--font-body);
    }

    /* --- LIGHT (BRIGHT) THEME OVERRIDES --- */
    body.light-mode {
      color-scheme: light;

      /* Base palette */
      --bg-dark: #f4f6f9;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(22, 42, 72, 0.09);
      --neon-green: #00a86b;
      --neon-red: #d60047;
      --accent-rgb: 217, 138, 0;
      --accent-text: #8a5b00;
      --accent-contrast: #ffffff;
      --neon-yellow: #b08900;
      --neon-purple: #9000c4;
      --input-bg: rgba(255, 255, 255, 0.55);
      --wash-a: 255, 206, 140;
      --wash-b: 255, 184, 158;
      --wash-strength: 0.55;

      /* Semantic tokens — re-declare the var() indirections so they re-resolve to the light palette */
      --bg: var(--bg-dark);
      --panel: var(--glass-bg);
      --border: var(--glass-border);
      --accent: var(--accent-text);
      --accent-strong: var(--accent-text);
      --bg-2: #f8fafc;
      --panel-solid: #ffffff;
      --text: #1e2633;
      --text-primary: #131a24;
      --muted: #5d6b7a;
      --text-muted: #5d6b7a;
      --faint: #9aa6b4;
      --accent-soft: rgba(var(--accent-rgb), 0.1);
      --accent-soft-border: rgba(var(--accent-rgb), 0.32);
      --shadow: 0 18px 44px rgba(60, 84, 124, 0.13), inset 0 1px 0 rgba(255, 255, 255, 0.65);

      background-image:
        radial-gradient(circle at 12% 12%, rgba(var(--wash-a), var(--wash-strength)), transparent 42%),
        radial-gradient(circle at 88% 8%, rgba(var(--wash-b), var(--wash-strength)), transparent 40%);
    }

    body.light-mode .calendar-header,
    body.light-mode .weekday {
      background: rgba(255, 255, 255, 0.38);
    }

    body.light-mode .day-cell.is-empty,
    body.light-mode .day-cell.is-outside,
    body.light-mode .day-cell.is-unavailable {
      background: rgba(22, 42, 72, 0.03);
    }

    body.light-mode .forecast-card,
    body.light-mode .forecast-card.tomorrow,
    body.light-mode .timeline-detail {
      background:
        linear-gradient(135deg, rgba(var(--accent-rgb), 0.08), transparent 55%),
        var(--panel);
    }

    body.light-mode .is-today .day-number {
      color: var(--accent-contrast);
    }

    body.light-mode .brand,
    body.light-mode .ghost-button,
    body.light-mode .refresh-button,
    body.light-mode .theme-toggle,
    body.light-mode .menu-toggle,
    body.light-mode .view-button.is-active,
    body.light-mode .refresh-button:disabled:hover,
    body.light-mode .ghost-button:disabled:hover,
    body.light-mode .condition-chip:not(.is-active):hover {
      color: var(--accent-text);
    }

    body.light-mode .ghost-button,
    body.light-mode .refresh-button,
    body.light-mode .theme-toggle,
    body.light-mode .menu-toggle {
      background: rgba(var(--accent-rgb), 0.1);
      border-color: rgba(var(--accent-rgb), 0.32);
    }

    body.light-mode .ghost-button:hover,
    body.light-mode .refresh-button:hover,
    body.light-mode .theme-toggle:hover,
    body.light-mode .menu-toggle:hover,
    body.light-mode .menu-toggle.is-open {
      color: var(--accent-contrast);
      box-shadow: 0 8px 24px rgba(var(--accent-rgb), 0.3);
    }

    body.light-mode .loading-skeleton {
      background: rgba(0, 0, 0, 0.06);
    }

    body.light-mode .loading-skeleton::after {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
    }

    /* --- WEATHER-REACTIVE LIGHT WASHES --- */
    body.light-mode[data-weather="clear"] {
      --accent-rgb: 217, 138, 0;
      --accent-text: #8a5b00;
      --wash-a: 255, 206, 140;
      --wash-b: 255, 184, 158;
    }

    body.light-mode[data-weather="fair"] {
      --accent-rgb: 43, 143, 208;
      --accent-text: #245f85;
      --wash-a: 170, 210, 248;
      --wash-b: 210, 220, 252;
    }

    body.light-mode[data-weather="cloud"] {
      --accent-rgb: 92, 112, 138;
      --accent-text: #56677d;
      --wash-a: 198, 208, 220;
      --wash-b: 212, 218, 228;
    }

    body.light-mode[data-weather="rain"] {
      --accent-rgb: 24, 127, 176;
      --accent-text: #245f76;
      --wash-a: 168, 198, 224;
      --wash-b: 190, 212, 230;
    }

    body.light-mode[data-weather="snow"] {
      --accent-rgb: 74, 159, 212;
      --accent-text: #3f718f;
      --wash-a: 210, 230, 248;
      --wash-b: 226, 238, 250;
    }

    body.light-mode[data-weather="storm"] {
      --accent-rgb: 122, 95, 208;
      --accent-text: #65539f;
      --wash-a: 206, 196, 238;
      --wash-b: 220, 210, 242;
    }

    /* --- WEATHER-REACTIVE ACCENTS (dark base) ---
       JS sets body[data-weather] from today's condition; each bucket
       recolors the accent and the two background glows. */
    body:not(.light-mode)[data-weather="clear"] {
      --accent-rgb: 255, 196, 0;
      --glow-a: 255, 170, 40;
      --glow-b: 255, 110, 70;
    }

    body:not(.light-mode)[data-weather="fair"] {
      --accent-rgb: 64, 196, 255;
      --glow-a: 40, 150, 240;
      --glow-b: 150, 120, 255;
    }

    body:not(.light-mode)[data-weather="cloud"] {
      --accent-rgb: 150, 180, 205;
      --glow-a: 90, 110, 140;
      --glow-b: 120, 130, 150;
    }

    body:not(.light-mode)[data-weather="rain"] {
      --accent-rgb: 0, 190, 230;
      --glow-a: 20, 100, 180;
      --glow-b: 0, 150, 160;
    }

    body:not(.light-mode)[data-weather="snow"] {
      --accent-rgb: 160, 215, 255;
      --glow-a: 150, 200, 255;
      --glow-b: 200, 220, 255;
    }

    body:not(.light-mode)[data-weather="storm"] {
      --accent-rgb: 170, 120, 255;
      --glow-a: 110, 60, 200;
      --glow-b: 60, 40, 110;
    }

    /* --- HEADER ACTIONS + THEME TOGGLE --- */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .theme-toggle,
    .menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      width: 44px;
      flex-shrink: 0;
      border-radius: var(--r-pill);
      color: var(--neon-blue);
      background: rgba(var(--accent-rgb),0.05);
      border: 1px solid rgba(var(--accent-rgb),0.3);
      font-size: 1.15rem;
      line-height: 1;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover,
    .menu-toggle:hover,
    .menu-toggle.is-open {
      color: var(--accent-contrast);
      background: var(--neon-blue);
      box-shadow: 0 8px 26px rgba(var(--accent-rgb), 0.32);
    }

    .condition-menu-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .condition-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      z-index: 40;
      width: min(360px, calc(100vw - 28px));
      padding: 12px;
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      color: var(--text);
      background: rgba(11, 13, 19, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .condition-menu[hidden] {
      display: none;
    }

    body.light-mode .condition-menu {
      background: rgba(255, 255, 255, 0.84);
      border-color: var(--border);
    }

    .condition-switcher {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .condition-switcher-label {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .condition-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 13px;
      border-radius: var(--r-pill);
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      font-size: 0.82rem;
      font-weight: 700;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .condition-chip:hover {
      color: var(--neon-blue);
      border-color: rgba(var(--accent-rgb), 0.32);
      box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.12);
    }

    .condition-chip.is-active {
      color: var(--accent-contrast);
      background: rgb(var(--accent-rgb));
      border-color: rgb(var(--accent-rgb));
      box-shadow: 0 6px 18px rgba(var(--accent-rgb), 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      color: var(--text);
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 50%, rgba(var(--glow-a), var(--glow-strength)), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(var(--glow-b), var(--glow-strength)), transparent 25%);
      background-attachment: fixed;
      transition: background-color 0.6s ease, color 0.3s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    body[data-weather="clear"]::before {
      opacity: 0.62;
      background:
        radial-gradient(circle at 82% 14%, rgba(var(--accent-rgb), 0.2), transparent 13%),
        radial-gradient(circle at 77% 19%, rgba(255, 255, 255, 0.18), transparent 18%);
      animation: sunBreathe 7s ease-in-out infinite;
    }

    body[data-weather="fair"]::before,
    body[data-weather="cloud"]::before {
      opacity: 0.48;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(255, 255, 255, 0.2), transparent 22%),
        radial-gradient(ellipse at 78% 24%, rgba(var(--accent-rgb), 0.14), transparent 25%),
        radial-gradient(ellipse at 42% 78%, rgba(255, 255, 255, 0.16), transparent 28%);
      animation: cloudDrift 18s ease-in-out infinite alternate;
    }

    body[data-weather="rain"]::after {
      opacity: 0.34;
      background-image: repeating-linear-gradient(
        105deg,
        transparent 0 18px,
        rgba(var(--accent-rgb), 0.2) 18px 20px,
        transparent 20px 32px
      );
      background-size: 135px 135px;
      animation: rainFall 900ms linear infinite;
    }

    body[data-weather="snow"]::after {
      opacity: 0.56;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.86) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(var(--accent-rgb), 0.34) 0 1.2px, transparent 1.8px);
      background-size: 72px 72px, 118px 118px;
      animation: snowFall 13s linear infinite;
    }

    body[data-weather="storm"]::before {
      opacity: 0.44;
      background:
        radial-gradient(circle at 16% 20%, rgba(var(--accent-rgb), 0.18), transparent 22%),
        radial-gradient(circle at 78% 16%, rgba(255, 255, 255, 0.12), transparent 18%);
      animation: stormPulse 5s ease-in-out infinite;
    }

    body[data-weather="storm"]::after {
      opacity: 0;
      background:
        linear-gradient(115deg, transparent 0 46%, rgba(255, 255, 255, 0.58) 48%, transparent 52%),
        linear-gradient(100deg, transparent 0 58%, rgba(var(--accent-rgb), 0.3) 60%, transparent 63%);
      animation: lightningFlash 7s steps(1, end) infinite;
    }

    .weather-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s ease;
    }

    body[data-weather] .weather-stage {
      opacity: 1;
    }

    .weather-stage > * {
      position: absolute;
      display: none;
      pointer-events: none;
      opacity: 0;
      transition: filter 0.7s ease;
    }

    .weather-sun {
      top: clamp(26px, 7vh, 78px);
      left: -180px;
      z-index: 1;
      width: clamp(96px, 13vw, 178px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 36%, rgba(255, 255, 230, 0.95) 0 8%, rgba(255, 231, 104, 0.95) 24%, rgba(255, 173, 45, 0.88) 48%, rgba(255, 177, 44, 0.18) 69%, transparent 73%);
      box-shadow:
        0 0 28px rgba(255, 225, 92, 0.42),
        0 0 86px rgba(255, 169, 40, 0.28),
        inset -18px -18px 34px rgba(205, 105, 0, 0.16);
    }

    .weather-sun::before,
    .weather-sun::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
    }

    .weather-sun::before {
      inset: -40%;
      background: repeating-conic-gradient(from 8deg, rgba(255, 222, 90, 0.18) 0deg 9deg, transparent 10deg 22deg);
      animation: sunSpin 32s linear infinite;
    }

    .weather-sun::after {
      inset: 14%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.38), transparent 58%);
      filter: blur(8px);
    }

    body[data-weather="clear"] .weather-sun {
      opacity: 0.94;
      animation: sunVoyage 18s linear infinite;
    }

    body[data-weather="fair"] .weather-sun {
      opacity: 0.66;
      animation: sunVoyage 21.5s linear infinite;
    }

    body.light-mode[data-weather="clear"] .weather-sun,
    body.light-mode[data-weather="fair"] .weather-sun {
      opacity: 0.72;
    }

    .weather-clouds {
      inset: -92px -18vw auto -18vw;
      z-index: 3;
      height: min(48vh, 430px);
      filter: blur(0.2px);
    }

    body[data-weather="fair"] .weather-clouds {
      opacity: 0.34;
    }

    body[data-weather="cloud"] .weather-clouds {
      opacity: 0.62;
    }

    body[data-weather="rain"] .weather-clouds,
    body[data-weather="snow"] .weather-clouds {
      opacity: 0.72;
    }

    body[data-weather="storm"] .weather-clouds {
      opacity: 0.96;
      filter: contrast(1.1) saturate(0.8);
    }

    .weather-cloud {
      --cloud-deep: 14, 18, 28;
      --cloud-mid: 48, 58, 74;
      --cloud-light: 114, 132, 152;
      --cloud-scale: 1;
      --cloud-start: -3vw;
      --cloud-end: 8vw;
      --cloud-lift: 12px;
      --cloud-duration: 5.25s;
      position: absolute;
      display: block;
      width: clamp(260px, 36vw, 650px);
      aspect-ratio: 3 / 1;
      border-radius: var(--r-pill);
      background:
        radial-gradient(ellipse at 18% 62%, rgba(var(--cloud-light), 0.7) 0 22%, transparent 54%),
        radial-gradient(ellipse at 42% 42%, rgba(var(--cloud-mid), 0.9) 0 34%, transparent 61%),
        radial-gradient(ellipse at 70% 62%, rgba(var(--cloud-deep), 0.86) 0 34%, transparent 63%),
        linear-gradient(180deg, rgba(var(--cloud-mid), 0.82), rgba(var(--cloud-deep), 0.88));
      box-shadow:
        inset 0 -24px 46px rgba(0, 0, 0, 0.26),
        0 24px 70px rgba(0, 0, 0, 0.24);
      animation: cloudSail var(--cloud-duration) ease-in-out infinite alternate;
    }

    .weather-cloud::before,
    .weather-cloud::after {
      content: "";
      position: absolute;
      bottom: 18%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 32%, rgba(var(--cloud-light), 0.78), rgba(var(--cloud-mid), 0.9) 54%, rgba(var(--cloud-deep), 0.82) 78%);
    }

    .weather-cloud::before {
      left: 14%;
      width: 34%;
      aspect-ratio: 1.08;
    }

    .weather-cloud::after {
      right: 16%;
      width: 42%;
      aspect-ratio: 1.18;
    }

    .cloud-one {
      top: 76px;
      left: 3vw;
      --cloud-scale: 1.08;
      --cloud-start: -6vw;
      --cloud-end: 7vw;
      --cloud-duration: 5.75s;
    }

    .cloud-two {
      top: 150px;
      right: -8vw;
      --cloud-scale: 0.86;
      --cloud-start: 7vw;
      --cloud-end: -6vw;
      --cloud-lift: -10px;
      --cloud-duration: 4.75s;
      animation-direction: alternate-reverse;
    }

    .cloud-three {
      top: 28px;
      left: 46vw;
      --cloud-scale: 0.68;
      --cloud-start: 5vw;
      --cloud-end: -8vw;
      --cloud-lift: 18px;
      --cloud-duration: 6.75s;
      opacity: 0.78;
    }

    body.light-mode .weather-cloud {
      --cloud-deep: 116, 128, 148;
      --cloud-mid: 176, 187, 204;
      --cloud-light: 248, 250, 255;
    }

    body[data-weather="storm"] .weather-cloud,
    body[data-weather="rain"] .weather-cloud {
      --cloud-deep: 4, 6, 12;
      --cloud-mid: 28, 31, 43;
      --cloud-light: 82, 88, 110;
    }

    body.light-mode[data-weather="storm"] .weather-cloud,
    body.light-mode[data-weather="rain"] .weather-cloud {
      --cloud-deep: 42, 47, 60;
      --cloud-mid: 86, 94, 112;
      --cloud-light: 160, 170, 190;
    }

    .weather-rain,
    .weather-snow,
    .weather-thunder,
    .weather-lightning {
      inset: 0;
    }

    .weather-rain {
      z-index: 4;
      transform: rotate(8deg) scale(1.12);
      transform-origin: center;
    }

    .weather-rain::before,
    .weather-rain::after {
      content: "";
      position: absolute;
      inset: -18%;
      background-image: repeating-linear-gradient(
        104deg,
        transparent 0 24px,
        rgba(154, 233, 255, 0.74) 25px 27px,
        transparent 28px 44px
      );
      background-size: 92px 136px;
      animation: rainRush 660ms linear infinite;
    }

    .weather-rain::after {
      background-image: repeating-linear-gradient(
        104deg,
        transparent 0 30px,
        rgba(var(--accent-rgb), 0.46) 31px 33px,
        transparent 34px 60px
      );
      background-size: 140px 196px;
      animation-duration: 980ms;
      opacity: 0.58;
      filter: blur(0.4px);
    }

    body[data-weather="rain"] .weather-rain {
      opacity: 0.54;
    }

    body[data-weather="storm"] .weather-rain {
      opacity: 0.7;
    }

    body.light-mode[data-weather="rain"] .weather-rain,
    body.light-mode[data-weather="storm"] .weather-rain {
      opacity: 0.36;
    }

    .weather-snow {
      z-index: 4;
    }

    .weather-snow::before,
    .weather-snow::after {
      content: "";
      position: absolute;
      inset: -12%;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.92) 0 1.4px, transparent 2px),
        radial-gradient(circle, rgba(222, 243, 255, 0.72) 0 2px, transparent 2.8px),
        radial-gradient(circle, rgba(var(--accent-rgb), 0.45) 0 1.2px, transparent 2px);
      background-size: 74px 86px, 132px 146px, 190px 206px;
      animation: snowFloatOne 17s linear infinite;
    }

    .weather-snow::after {
      background-size: 118px 126px, 178px 196px, 248px 260px;
      opacity: 0.62;
      filter: blur(0.3px);
      animation: snowFloatTwo 25s linear infinite;
    }

    body[data-weather="snow"] .weather-snow {
      opacity: 0.76;
    }

    body.light-mode[data-weather="snow"] .weather-snow {
      opacity: 0.5;
    }

    .weather-thunder {
      z-index: 2;
      background:
        radial-gradient(circle at 64% 18%, rgba(146, 120, 255, 0.26), transparent 28%),
        radial-gradient(circle at 28% 26%, rgba(20, 24, 42, 0.62), transparent 34%),
        linear-gradient(180deg, rgba(3, 4, 9, 0.72), transparent 54%);
      animation: thunderMood 7.2s ease-in-out infinite;
    }

    body[data-weather="storm"] .weather-thunder {
      opacity: 0.82;
    }

    body.light-mode[data-weather="storm"] .weather-thunder {
      opacity: 0.44;
    }

    .weather-lightning {
      z-index: 5;
    }

    body[data-weather="storm"] .weather-lightning {
      opacity: 1;
    }

    .weather-lightning::before,
    .weather-lightning::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0;
    }

    .weather-lightning::before {
      top: clamp(24px, 6vh, 72px);
      left: clamp(44%, 58vw, 72%);
      width: clamp(76px, 8vw, 136px);
      height: clamp(260px, 44vh, 430px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(172, 225, 255, 0.9) 42%, rgba(156, 120, 255, 0.28));
      clip-path: polygon(42% 0, 66% 0, 54% 33%, 76% 33%, 34% 100%, 46% 53%, 25% 53%);
      filter:
        drop-shadow(0 0 12px rgba(255, 255, 255, 0.86))
        drop-shadow(0 0 34px rgba(var(--accent-rgb), 0.72));
      animation: lightningStrike 7.2s steps(1, end) infinite;
    }

    .weather-lightning::after {
      inset: 0;
      background:
        radial-gradient(circle at 62% 20%, rgba(255, 255, 255, 0.58), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.24), transparent 62%);
      animation: lightningGlow 7.2s steps(1, end) infinite;
    }

    body[data-weather="clear"] .weather-stage > .weather-sun {
      display: block;
      opacity: 0.94;
      animation: sunVoyage 18s linear infinite;
    }

    body[data-weather="fair"] .weather-stage > .weather-sun {
      display: block;
      opacity: 0.66;
      animation: sunVoyage 21.5s linear infinite;
    }

    body.light-mode[data-weather="clear"] .weather-stage > .weather-sun,
    body.light-mode[data-weather="fair"] .weather-stage > .weather-sun {
      opacity: 0.72;
    }

    body[data-weather="cloud"] .weather-stage > .weather-sun,
    body[data-weather="rain"] .weather-stage > .weather-sun,
    body[data-weather="snow"] .weather-stage > .weather-sun,
    body[data-weather="storm"] .weather-stage > .weather-sun {
      display: none;
      opacity: 0;
      animation: none;
    }

    body[data-weather="fair"] .weather-stage > .weather-clouds {
      display: block;
      opacity: 0.34;
    }

    body[data-weather="cloud"] .weather-stage > .weather-clouds {
      display: block;
      opacity: 0.62;
    }

    body[data-weather="rain"] .weather-stage > .weather-clouds,
    body[data-weather="snow"] .weather-stage > .weather-clouds {
      display: block;
      opacity: 0.72;
    }

    body[data-weather="storm"] .weather-stage > .weather-clouds {
      display: block;
      opacity: 0.96;
      filter: contrast(1.1) saturate(0.8);
    }

    body[data-weather="rain"] .weather-stage > .weather-rain {
      display: block;
      opacity: 0.54;
    }

    body[data-weather="storm"] .weather-stage > .weather-rain {
      display: block;
      opacity: 0.7;
    }

    body.light-mode[data-weather="rain"] .weather-stage > .weather-rain,
    body.light-mode[data-weather="storm"] .weather-stage > .weather-rain {
      opacity: 0.36;
    }

    body[data-weather="snow"] .weather-stage > .weather-snow {
      display: block;
      opacity: 0.76;
    }

    body.light-mode[data-weather="snow"] .weather-stage > .weather-snow {
      opacity: 0.5;
    }

    body[data-weather="storm"] .weather-stage > .weather-thunder {
      display: block;
      opacity: 0.82;
    }

    body.light-mode[data-weather="storm"] .weather-stage > .weather-thunder {
      opacity: 0.44;
    }

    body[data-weather="storm"] .weather-stage > .weather-lightning {
      display: block;
      opacity: 1;
    }

    @media (max-width: 720px) {
      body {
        background-attachment: scroll;
      }

      body[data-weather="rain"]::after,
      body[data-weather="storm"]::before,
      body[data-weather="storm"]::after {
        animation: none;
        opacity: 0;
      }

      .weather-stage {
        contain: layout paint style;
      }

      .weather-stage > * {
        transition: none;
      }

      .weather-clouds {
        height: min(32vh, 240px);
        inset: -70px -32vw auto -32vw;
      }

      .weather-cloud {
        width: clamp(240px, 62vw, 430px);
        box-shadow:
          inset 0 -18px 34px rgba(0, 0, 0, 0.2),
          0 18px 42px rgba(0, 0, 0, 0.18);
      }

      .cloud-two {
        top: 118px;
      }

      .cloud-three {
        display: none;
      }

      .weather-rain {
        transform: rotate(8deg) scale(1.04);
      }

      .weather-rain::before {
        inset: -10%;
        background-size: 128px 196px;
        animation-duration: 1450ms;
        opacity: 0.82;
      }

      .weather-rain::after {
        display: none;
      }

      body[data-weather="rain"] .weather-stage > .weather-rain,
      body[data-weather="storm"] .weather-stage > .weather-rain,
      body.light-mode[data-weather="rain"] .weather-stage > .weather-rain,
      body.light-mode[data-weather="storm"] .weather-stage > .weather-rain {
        opacity: 0.24;
      }

      .weather-thunder {
        background:
          linear-gradient(180deg, rgba(3, 4, 9, 0.46), transparent 46%),
          radial-gradient(circle at 58% 16%, rgba(146, 120, 255, 0.18), transparent 24%);
        animation: none;
      }

      body[data-weather="storm"] .weather-stage > .weather-thunder,
      body.light-mode[data-weather="storm"] .weather-stage > .weather-thunder {
        opacity: 0.24;
      }

      .weather-lightning::before {
        top: clamp(18px, 5vh, 54px);
        left: 58vw;
        width: clamp(48px, 14vw, 78px);
        height: clamp(180px, 34vh, 280px);
        filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.72));
        animation-duration: 9s;
      }

      .weather-lightning::after {
        display: none;
      }
    }

    button,

    .page {

      box-shadow: var(--shadow);

      text-align: left;

    .suggestion:hover,

    }

    .suggestion span {

    }

    .status {

    }

    .status:empty {

    }

    .status.error {
      color: var(--neon-red);
    }

    .view-style-picker {

      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .view-buttons {

      gap: 8px;
    }

    .view-button {
      min-height: 38px;
      border-radius: var(--r-pill);
      padding: 0 16px;
      color: var(--muted);
      background: var(--input-bg);
      border: 1px solid var(--border);
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .view-button.is-active {
      color: var(--neon-blue);

      box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.12);
    }

    .feature-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(224px, 78vw);
      gap: 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 2px 2px 10px;
      margin-bottom: 18px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }

    .rain-panel {
      position: relative;
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      background:
        linear-gradient(115deg, rgba(24, 127, 176, 0.12), transparent 48%),
        var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }

    .rain-panel::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: -120px;
      right: -40px;
      border-radius: 50%;
      background: rgba(24, 127, 176, 0.13);
      filter: blur(24px);
      pointer-events: none;
    }

    .rain-panel-header {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px 14px;
    }

    .rain-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rain-drop {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border-radius: 65% 35% 62% 38%;
      background: #189bd1;
      box-shadow: 0 0 20px rgba(24, 155, 209, 0.42);
      transform: rotate(-45deg);
    }

    .rain-panel h2 {
      margin: 2px 0 0;
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      letter-spacing: -0.03em;
    }

    .rain-summary {
      min-width: min(100%, 240px);
      text-align: right;
    }

    .rain-summary strong,
    .rain-summary span {
      display: block;
    }

    .rain-summary strong {
      color: var(--text-primary);
      font-size: 0.92rem;
    }

    .rain-summary span {
      margin-top: 3px;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .rain-chart-scroll {
      position: relative;
      z-index: 1;
      overflow-x: auto;
      padding: 10px 12px 8px;
      border-top: 1px solid var(--glass-border);
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }

    .rain-chart {
      display: block;
      width: 100%;
      min-width: 680px;
      height: auto;
      overflow: visible;
    }

    .rain-chart-grid {
      stroke: rgba(91, 132, 160, 0.2);
      stroke-width: 1;
      stroke-dasharray: 3 5;
    }

    .rain-chart-axis {
      fill: var(--muted);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
    }

    .rain-chart-unit {
      fill: var(--text-primary);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .rain-chart-area {
      fill: url("#rainAreaGradient");
    }

    .rain-water-motion {
      clip-path: url("#rainAreaClip");
      pointer-events: none;
    }

    .rain-water-sheen {
      fill: url("#rainSheenGradient");
      opacity: 0.55;
      animation: waterSheenDrift 5.5s ease-in-out infinite alternate;
    }

    .rain-drop-streak {
      fill: none;
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 2.35;
      stroke-linecap: round;
      filter:
        drop-shadow(0 0 3px rgba(255, 255, 255, 0.72))
        drop-shadow(0 0 6px rgba(34, 184, 240, 0.5));
      opacity: 0;
      animation: rainDropDive var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .rain-splash-ring,
    .rain-splash-crown {
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 1.65;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.45));
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: rainSplashBloom var(--duration) ease-out infinite;
      animation-delay: var(--delay);
    }

    .rain-splash-crown {
      animation-name: rainSplashCrown;
    }

    .rain-chart-line {
      fill: none;
      stroke: #22b8f0;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px rgba(34, 184, 240, 0.38));
      animation: chartReveal 700ms ease-out both;
    }

    .rain-chart-point circle {
      fill: #22b8f0;
      stroke: rgba(218, 247, 255, 0.9);
      stroke-width: 2;
      filter: drop-shadow(0 0 5px rgba(34, 184, 240, 0.65));
      transition: r 140ms ease;
    }

    .rain-chart-point:hover circle {
      r: 6;
    }

    .rain-chart-value {
      fill: var(--text-primary);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 800;
      paint-order: stroke;
      stroke: var(--panel-solid);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .rain-chart-time {
      fill: var(--muted);
      font-family: var(--font-display);
      font-size: 9px;
      font-weight: 700;
    }

    @keyframes chartReveal {
      from {
        opacity: 0;
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
      }
      to {
        opacity: 1;
        stroke-dasharray: 900;
        stroke-dashoffset: 0;
      }
    }

    @keyframes waterSheenDrift {
      from {
        transform: translateX(-90px);
        opacity: 0.32;
      }
      to {
        transform: translateX(80px);
        opacity: 0.62;
      }
    }

    @keyframes rainDropDive {
      0%, 12% {
        opacity: 0;
        transform: translateY(-16px);
      }
      20% {
        opacity: 0.98;
      }
      48% {
        opacity: 0.84;
        transform: translateY(24px);
      }
      52%, 100% {
        opacity: 0;
        transform: translateY(28px);
      }
    }

    @keyframes rainSplashBloom {
      0%, 46% {
        opacity: 0;
        transform: scale(0.25);
      }
      52% {
        opacity: 0.88;
      }
      72% {
        opacity: 0;
        transform: scale(1.8);
      }
      100% {
        opacity: 0;
        transform: scale(1.8);
      }
    }

    @keyframes rainSplashCrown {
      0%, 44% {
        opacity: 0;
        transform: translateY(4px) scale(0.45);
      }
      51% {
        opacity: 0.92;
      }
      68% {
        opacity: 0;
        transform: translateY(-4px) scale(1.35);
      }
      100% {
        opacity: 0;
        transform: translateY(-4px) scale(1.35);
      }
    }

      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }

    .loading-skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb),0.12), transparent);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);

    @keyframes sunBreathe {
      0%, 100% { transform: scale(1); filter: blur(0); }

    @keyframes cloudDrift {
      0% { transform: translate3d(-18px, 0, 0); }

    }

    @keyframes rainFall {
      0% { background-position: 0 0; }
      100% { background-position: -36px 135px; }
    }

    @keyframes snowFall {
      0% { background-position: 0 -80px, 0 -120px; }
      100% { background-position: 28px 220px, -32px 260px; }
    }

    @keyframes stormPulse {
      0%, 100% { filter: saturate(1); transform: scale(1); }
      45% { filter: saturate(1.18); transform: scale(1.02); }

    }

    @keyframes lightningFlash {

    @keyframes sunVoyage {

    @keyframes sunSpin {
      100% { transform: rotate(360deg); }

    @keyframes cloudSail {

      0% { background-position: 0 -140px; }

    }

    @keyframes snowFloatOne {

    }

    @keyframes snowFloatTwo {
      0% { background-position: -88px -180px, 70px -260px, 0 -320px; }
      100% { background-position: -24px 760px, 154px 860px, -96px 940px; }
    }

    @keyframes thunderMood {
      0%, 64%, 100% { filter: brightness(0.95) saturate(0.9); transform: scale(1); }
      67% { filter: brightness(1.28) saturate(1.25); transform: scale(1.015); }
      70% { filter: brightness(0.84) saturate(0.78); transform: scale(1.006); }
    }

    @keyframes lightningStrike {
      0%, 63%, 66%, 69%, 100% { opacity: 0; transform: translateY(-18px) scaleY(0.92); }
      64%, 68% { opacity: 1; transform: translateY(0) scaleY(1); }
    }

    @keyframes lightningGlow {
      0%, 63%, 66%, 69%, 100% { opacity: 0; }
      64% { opacity: 0.58; }
      68% { opacity: 0.34; }
    }

    @keyframes sunnyFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(4deg); }
    }

    @keyframes cloudBob {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }

    @keyframes rainNod {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(3px) rotate(-2deg); }
    }

    @keyframes snowDrift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(4px, -3px) rotate(3deg); }
    }

    @keyframes stormJolt {
      0%, 72%, 100% { transform: translateX(0) rotate(0deg); }
      74% { transform: translateX(-2px) rotate(-2deg); }
      76% { transform: translateX(2px) rotate(2deg); }
      78% { transform: translateX(0) rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .rain-water-sheen {
        animation-duration: 8s !important;
        animation-iteration-count: infinite !important;
      }

      .rain-drop-streak,
      .rain-splash-ring,
      .rain-splash-crown {
        animation-duration: calc(var(--duration) * 1.6) !important;
        animation-iteration-count: infinite !important;
      }
    }

    @media (min-width: 720px) {
      .page {
        padding: 38px 24px 52px;
      }

      .feature-grid {
        grid-auto-flow: row;
        grid-auto-columns: initial;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        overflow: visible;
        padding: 0;
        scroll-snap-type: none;
      }

      .rain-chart-scroll {
        padding-inline: 18px;
      }

      .rain-chart {
        min-width: 0;
      }

      .calendar-header {
        padding: 20px 22px;
      }

      .day-cell {
        min-height: 142px;
        padding: 11px;
      }

      .day-temps {
        flex-direction: row;
        align-items: baseline;
        gap: 5px;
      }

      .day-temps .t-sep {
        display: inline;
        color: var(--muted);
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-inline: 9px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .rain-summary {
        width: 100%;
        text-align: left;
      }

      .condition-menu {
        width: min(330px, calc(100vw - 18px));
      }

      .condition-switcher {
        grid-template-columns: 1fr;
      }

      .calendar-panel,
      .timeline-panel {
        border-radius: 0;
        margin-inline: -9px;
        border-left: 0;
        border-right: 0;
      }

      .calendar-header {
        padding-inline: 10px;
      }

      .day-cell {
        min-height: 98px;

      }

      .day-label {
        display: none;
      }

      .day-details {
        gap: 1px;
      }

      .empty-copy {
        margin-top: 8px;
      }

      .timeline-strip {
        grid-auto-columns: clamp(160px, 46vw, 220px);
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>
