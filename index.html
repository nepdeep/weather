<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30-Day Weather Calendar</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fdf5ed;
      --bg-2: #fffaf4;
      --panel: rgba(255, 255, 255, 0.92);
      --panel-solid: #ffffff;
      --text: #322e37;
      --muted: #8c8492;
      --faint: #b7adb8;
      --border: #f0e4d6;
      --accent: #f0913e;
      --accent-strong: #e07a28;
      --accent-soft: #fce6d0;
      --accent-soft-border: #f6d2ae;
      --mint: #e7f6ee;
      --sun: #ffe9c4;
      --warn: #fff1e2;
      --shadow: 0 18px 50px rgba(199, 138, 79, 0.16);
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
      --r-pill: 999px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #ffe5cb 0, transparent 34rem),
        radial-gradient(circle at top right, #fff0e2 0, transparent 30rem),
        linear-gradient(135deg, #fdf5ed 0%, #fefaf4 50%, #fdf1e7 100%);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px 14px 32px;
    }

    .app-header {
      display: grid;
      gap: 18px;
      margin-bottom: 18px;
    }

    .brand-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-mark {
      font-size: 1.3rem;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(224, 122, 40, 0.3));
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .controls {
      width: min(430px, 100%);
    }

    .search-wrap {
      position: relative;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .search-input,
    .ghost-button,
    .refresh-button {
      min-height: 44px;
      border-radius: var(--r-md);
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      padding: 0 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.92);
      outline: none;
      transition: border 160ms ease, box-shadow 160ms ease;
    }

    .search-input:focus {
      border-color: rgba(240, 145, 62, 0.75);
      box-shadow: 0 0 0 4px rgba(240, 145, 62, 0.16);
    }

    .ghost-button,
    .refresh-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border-radius: var(--r-pill);
      color: #ffffff;
      background: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 10px 22px rgba(224, 122, 40, 0.26);
    }

    .refresh-button {
      box-shadow: 0 12px 24px rgba(224, 122, 40, 0.3);
    }

    .refresh-button:disabled,
    .ghost-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .suggestions {
      position: absolute;
      z-index: 5;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .suggestion {
      width: 100%;
      display: block;
      padding: 10px 12px;
      color: var(--text);
      background: #ffffff;
      text-align: left;
      border-bottom: 1px solid #f4ece2;
    }

    .suggestion:last-child {
      border-bottom: 0;
    }

    .suggestion:hover,
    .suggestion:focus {
      background: #fdf1e6;
      outline: none;
    }

    .suggestion strong {
      display: block;
      font-size: 0.94rem;
    }

    .suggestion span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .status:empty {
      display: none;
    }

    .status.error {
      color: #a1431f;
    }

    .view-style-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .view-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .view-button {
      min-height: 38px;
      border-radius: var(--r-pill);
      padding: 0 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--border);
      font-weight: 900;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .view-button.is-active {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent-soft-border);
      box-shadow: 0 8px 18px rgba(224, 122, 40, 0.14);
    }

    .feature-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .forecast-card {
      position: relative;
      overflow: hidden;
      min-height: 184px;
      padding: 18px;
      border: 1px solid rgba(240, 228, 214, 0.9);
      border-radius: var(--r-lg);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(255, 246, 237, 0.9)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .forecast-card.tomorrow {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(255, 243, 233, 0.92)),
        var(--panel);
    }

    .card-kicker,
    .month-note {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .card-date {
      margin-top: 6px;
      font-size: 1.04rem;
      font-weight: 800;
    }

    .card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 20px 0 16px;
    }

    .weather-icon {
      line-height: 1;
      font-size: 3.4rem;
      filter: drop-shadow(0 8px 14px rgba(199, 138, 79, 0.2));
    }

    .temps {
      text-align: right;
    }

    .temp-max {
      font-size: 2.25rem;
      line-height: 1;
      font-weight: 900;
    }

    .temp-min {
      margin-top: 4px;
      color: var(--muted);
      font-weight: 800;
    }

    .weather-label {
      color: var(--muted);
      font-weight: 800;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border-radius: var(--r-sm);
      background: rgba(253, 240, 228, 0.7);
      border: 1px solid rgba(240, 224, 208, 0.8);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      overflow-wrap: anywhere;
      font-size: 0.9rem;
    }

    .view-panel[hidden] {
      display: none;
    }

    .calendar-panel,
    .timeline-panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .calendar-header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.78);
    }

    .calendar-header h2 {
      margin: 3px 0 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .calendar-meta {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .weekday-grid,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday {
      padding: 10px 4px;
      color: var(--muted);
      background: #fdf6ef;
      border-bottom: 1px solid var(--border);
      font-size: clamp(0.68rem, 2.6vw, 0.86rem);
      font-weight: 900;
      text-align: center;
    }

    .day-cell {
      position: relative;
      min-width: 0;
      min-height: 108px;
      padding: 8px 6px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.78);
    }

    .day-cell:nth-child(7n) {
      border-right: 0;
    }

    .day-cell.is-today {
      background: linear-gradient(180deg, #ffe7d1, #ffffff 70%);
      box-shadow: inset 0 0 0 2px #f2a65e;
    }

    .day-cell.is-empty,
    .day-cell.is-outside {
      color: var(--faint);
      background: rgba(250, 244, 237, 0.6);
    }

    .day-cell.is-unavailable {
      color: var(--faint);
      background: rgba(251, 246, 240, 0.72);
    }

    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3px;
      min-height: 24px;
    }

    .day-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.86rem;
    }

    .is-today .day-number {
      color: #ffffff;
      background: #ee8a36;
    }

    .day-icon {
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      line-height: 1;
    }

    .day-label {
      margin-top: 6px;
      min-height: 28px;
      color: var(--muted);
      font-size: clamp(0.66rem, 2.3vw, 0.78rem);
      font-weight: 800;
      line-height: 1.15;
    }

    .day-temps {
      margin-top: 8px;
      font-weight: 900;
      font-size: clamp(0.77rem, 2.7vw, 0.92rem);
      white-space: nowrap;
    }

    .day-details {
      display: grid;
      gap: 3px;
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(0.66rem, 2.4vw, 0.78rem);
      font-weight: 800;
    }

    .empty-copy {
      margin-top: 10px;
      color: var(--faint);
      font-size: clamp(0.62rem, 2.4vw, 0.78rem);
      font-weight: 800;
      line-height: 1.16;
    }

    .timeline-body {
      padding: 14px;
    }

    .timeline-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(112px, 1fr);
      gap: 10px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      scroll-snap-type: x proximity;
    }

    .timeline-day {
      display: grid;
      gap: 6px;
      min-height: 142px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      color: var(--text);
      background: #ffffff;
      text-align: left;
      scroll-snap-align: start;
    }

    .timeline-day.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240, 145, 62, 0.18);
    }

    .timeline-day.is-unavailable {
      color: var(--faint);
      background: #fbf6f0;
    }

    .timeline-date {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .timeline-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .timeline-temp {
      font-weight: 900;
    }

    .temp-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #f4e7d8;
    }

    .temp-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f7c98a, #ee7e3c);
    }

    .timeline-detail {
      display: grid;
      gap: 12px;
      margin-top: 4px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 245, 236, 0.92)),
        #ffffff;
    }

    .timeline-detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .timeline-detail h3 {
      margin: 0;
      font-size: clamp(1.18rem, 4vw, 1.8rem);
      letter-spacing: 0;
    }

    .detail-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .recent-cities {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .recent-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .recent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: var(--r-pill);
      color: var(--text);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    .recent-chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent-soft-border);
    }

    .recent-chip-flag {
      font-size: 0.9rem;
    }

    .empty-state {
      padding: 18px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    .loading-skeleton {
      position: relative;
      overflow: hidden;
      background: #f8ede0;
    }

    .loading-skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    @media (min-width: 720px) {
      .page {
        padding: 38px 24px 52px;
      }

      .feature-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .calendar-header {
        padding: 20px 22px;
      }

      .day-cell {
        min-height: 142px;
        padding: 11px;
      }
    }

    @media (max-width: 430px) {
      .page {
        padding-inline: 9px;
      }

      .search-row {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: 1fr;
      }

      .calendar-panel,
      .timeline-panel {
        border-radius: 0;
        margin-inline: -9px;
        border-left: 0;
        border-right: 0;
      }

      .calendar-header {
        padding-inline: 10px;
      }

      .day-cell {
        min-height: 98px;
        padding: 6px 4px;
      }

      .day-label {
        display: none;
      }

      .day-details {
        gap: 1px;
      }

      .empty-copy {
        margin-top: 8px;
      }

      .timeline-strip {
        grid-auto-columns: minmax(104px, 42vw);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="app-header">
      <div class="brand-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">☀️</span>
          <span id="brandName">EINDHOVEN</span>
        </div>
        <section class="controls" aria-label="Weather controls">
          <div class="search-wrap">
            <div class="search-row">
              <input class="search-input" id="cityInput" type="search" placeholder="Search city" autocomplete="off" aria-autocomplete="list" aria-expanded="false">
              <button class="ghost-button" id="searchButton" type="button">Search</button>
            </div>
            <div class="suggestions" id="suggestions" hidden></div>
          </div>
        </section>
      </div>

      <div class="title-row">
        <div class="title-block">
          <h1>30-Day Weather Calendar</h1>
          <p id="locationSummary">Eindhoven, Netherlands</p>
        </div>
        <button class="refresh-button" id="refreshButton" type="button">↻ Refresh</button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">Loading forecast...</p>

    <section class="view-style-picker view-buttons" role="tablist" aria-label="Forecast presentation styles">
      <button class="view-button is-active" type="button" data-view="calendar" role="tab" aria-selected="true">Calendar</button>
      <button class="view-button" type="button" data-view="timeline" role="tab" aria-selected="false">Timeline</button>
    </section>

    <section class="feature-grid" aria-label="Featured forecast cards">
      <article class="forecast-card" id="todayCard"></article>
      <article class="forecast-card tomorrow" id="tomorrowCard"></article>
      <article class="forecast-card tomorrow" id="dayAfterCard"></article>
    </section>

    <div class="recent-cities" id="recentCities" hidden>
      <span class="recent-label">Recent</span>
      <div class="recent-chips" id="recentChips"></div>
    </div>

    <section class="calendar-panel view-panel" id="calendarPanel" data-view-panel="calendar" aria-label="Monthly weather calendar">
      <div class="calendar-header">
        <div>
          <div class="month-note">Calendar</div>
          <h2 id="monthTitle">Month</h2>
        </div>
        <div class="calendar-meta" id="calendarMeta" hidden>Forecast range unavailable</div>
      </div>
      <div class="weekday-grid" aria-hidden="true">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>

    <section class="timeline-panel view-panel" id="timelinePanel" data-view-panel="timeline" aria-label="Interactive forecast timeline" hidden>
      <div class="calendar-header">
        <div>
          <div class="month-note">Timeline</div>
          <h2>Browse day by day</h2>
        </div>
        <div class="calendar-meta" id="timelineMeta">Select a day</div>
      </div>
      <div class="timeline-body">
        <div class="timeline-strip" id="timelineStrip" aria-label="Forecast days"></div>
        <article class="timeline-detail" id="timelineDetail"></article>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_LOCATION = {
      name: "Eindhoven",
      country: "Netherlands",
      admin1: "North Brabant",
      latitude: 51.471623,
      longitude: 5.466123,
      timezone: "Europe/Amsterdam"
    };

    const FORECAST_DAYS = 16;
    const STORAGE_KEY = "weather-calendar-location";
    const RECENT_KEY = "weather-calendar-recent";
    const FORECAST_ENDPOINT = "https://api.open-meteo.com/v1/forecast";
    const GEOCODING_ENDPOINT = "https://geocoding-api.open-meteo.com/v1/search";

    const weatherCodes = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Fog", "🌫️"],
      48: ["Rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Drizzle", "🌦️"],
      55: ["Dense drizzle", "🌧️"],
      56: ["Freezing drizzle", "🌧️"],
      57: ["Freezing drizzle", "🌧️"],
      61: ["Light rain", "🌦️"],
      63: ["Rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      66: ["Freezing rain", "🌧️"],
      67: ["Freezing rain", "🌧️"],
      71: ["Light snow", "🌨️"],
      73: ["Snow", "🌨️"],
      75: ["Heavy snow", "❄️"],
      77: ["Snow grains", "❄️"],
      80: ["Rain showers", "🌦️"],
      81: ["Rain showers", "🌧️"],
      82: ["Heavy showers", "⛈️"],
      85: ["Snow showers", "🌨️"],
      86: ["Snow showers", "❄️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm hail", "⛈️"],
      99: ["Thunderstorm hail", "⛈️"]
    };

    const els = {
      brandName: document.querySelector("#brandName"),
      locationSummary: document.querySelector("#locationSummary"),
      cityInput: document.querySelector("#cityInput"),
      searchButton: document.querySelector("#searchButton"),
      suggestions: document.querySelector("#suggestions"),
      refreshButton: document.querySelector("#refreshButton"),
      status: document.querySelector("#status"),
      todayCard: document.querySelector("#todayCard"),
      tomorrowCard: document.querySelector("#tomorrowCard"),
      dayAfterCard: document.querySelector("#dayAfterCard"),
      recentCities: document.querySelector("#recentCities"),
      recentChips: document.querySelector("#recentChips"),
      viewButtons: document.querySelectorAll(".view-button"),
      viewPanels: document.querySelectorAll(".view-panel"),
      monthTitle: document.querySelector("#monthTitle"),
      calendarMeta: document.querySelector("#calendarMeta"),
      calendarGrid: document.querySelector("#calendarGrid"),
      timelineMeta: document.querySelector("#timelineMeta"),
      timelineStrip: document.querySelector("#timelineStrip"),
      timelineDetail: document.querySelector("#timelineDetail")
    };

    let locationState = readSavedLocation();
    let forecastState = null;
    let searchResults = [];
    let searchTimer = null;
    let activeView = "calendar";
    let selectedTimelineKey = null;

    init();

    function init() {
      els.cityInput.value = locationState.name;
      setBrand();
      bindEvents();
      renderRecentCities();
      renderLoading();
      loadForecast();
    }

    function bindEvents() {
      els.refreshButton.addEventListener("click", () => loadForecast());
      els.searchButton.addEventListener("click", handleSearchSubmit);
      els.cityInput.addEventListener("input", handleSearchInput);
      els.cityInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          handleSearchSubmit();
        }
        if (event.key === "Escape") {
          hideSuggestions();
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".search-wrap")) {
          hideSuggestions();
        }
      });
      els.viewButtons.forEach((button) => {
        button.addEventListener("click", () => setActiveView(button.dataset.view));
      });
    }

    function setActiveView(view) {
      activeView = view;
      els.viewButtons.forEach((button) => {
        const isActive = button.dataset.view === view;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
      els.viewPanels.forEach((panel) => {
        panel.hidden = panel.dataset.viewPanel !== view;
      });
    }

    function readSavedLocation() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.name && Number.isFinite(saved.latitude) && Number.isFinite(saved.longitude)) {
          return { ...DEFAULT_LOCATION, ...saved };
        }
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
      return { ...DEFAULT_LOCATION };
    }

    function saveLocation(location) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(location));
    }

    function saveRecentCity(location) {
      let recents = readRecentCities();
      recents = recents.filter((r) => r.name !== location.name || r.country !== location.country);
      recents.unshift({ name: location.name, country: location.country, admin1: location.admin1, latitude: location.latitude, longitude: location.longitude, timezone: location.timezone });
      localStorage.setItem(RECENT_KEY, JSON.stringify(recents.slice(0, 5)));
    }

    function readRecentCities() {
      try {
        return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
      } catch {
        return [];
      }
    }

    function renderRecentCities() {
      const recents = readRecentCities().filter((r) => r.name !== locationState.name || r.country !== locationState.country);
      els.recentCities.hidden = recents.length === 0;
      els.recentChips.innerHTML = recents.map((r, i) => `
        <button class="recent-chip" type="button" data-index="${i}" aria-label="Load ${escapeHtml(r.name)}, ${escapeHtml(r.country)}">
          <span>${escapeHtml(r.name)}</span>
          <span style="color:var(--muted);font-size:0.78rem">${escapeHtml(r.country)}</span>
        </button>
      `).join("");
      els.recentChips.querySelectorAll(".recent-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          const city = recents[Number(btn.dataset.index)];
          selectLocation(city);
        });
      });
    }

    async function loadForecast() {
      setBusy(true);
      setStatus(`Loading forecast for ${formatLocation(locationState)}...`);
      hideSuggestions();

      try {
        const params = new URLSearchParams({
          latitude: locationState.latitude,
          longitude: locationState.longitude,
          daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,weather_code,wind_speed_10m_max",
          timezone: locationState.timezone || DEFAULT_LOCATION.timezone,
          forecast_days: FORECAST_DAYS
        });

        const response = await fetch(`${FORECAST_ENDPOINT}?${params}`);
        if (!response.ok) {
          throw new Error(`Forecast request failed with status ${response.status}`);
        }

        const forecast = await response.json();
        if (!forecast.daily || !Array.isArray(forecast.daily.time)) {
          throw new Error("Forecast response did not include daily data.");
        }

        forecastState = normalizeForecast(forecast);
        renderApp();
        setStatus("");
      } catch (error) {
        console.error(error);
        setStatus("Could not load the forecast. Please try refreshing or search for another city.", true);
        renderUnavailableShell();
      } finally {
        setBusy(false);
      }
    }

    function normalizeForecast(forecast) {
      const daily = forecast.daily;
      const byDate = new Map();
      daily.time.forEach((dateKey, index) => {
        byDate.set(dateKey, {
          dateKey,
          max: daily.temperature_2m_max?.[index],
          min: daily.temperature_2m_min?.[index],
          rainProbability: daily.precipitation_probability_max?.[index],
          precipitation: daily.precipitation_sum?.[index],
          code: daily.weather_code?.[index],
          wind: daily.wind_speed_10m_max?.[index]
        });
      });

      return {
        timezone: forecast.timezone || locationState.timezone || DEFAULT_LOCATION.timezone,
        byDate,
        startDate: daily.time[0],
        endDate: daily.time[daily.time.length - 1]
      };
    }

    function renderApp() {
      const timezone = forecastState.timezone;
      const todayParts = getDatePartsInTimeZone(new Date(), timezone);
      const todayKey = toDateKey(todayParts.year, todayParts.month, todayParts.day);
      const tomorrowKey = addDays(todayKey, 1);

      els.locationSummary.textContent = `${formatLocation(locationState)} · ${timezone}`;
      setBrand();
      startClock(timezone);
      renderFeatureCard(els.todayCard, "Today", todayKey, forecastState.byDate.get(todayKey));
      renderFeatureCard(els.tomorrowCard, "Tomorrow", tomorrowKey, forecastState.byDate.get(tomorrowKey));
      const dayAfterKey = addDays(todayKey, 2);
      renderFeatureCard(els.dayAfterCard, formatCompactWeekday(dayAfterKey), dayAfterKey, forecastState.byDate.get(dayAfterKey));
      renderCalendar(todayKey);
      renderTimeline(todayKey);
      setActiveView(activeView);
      els.calendarMeta.textContent = `Forecast available ${formatShortDate(forecastState.startDate)}–${formatShortDate(forecastState.endDate)}`;
    }

    function renderFeatureCard(card, label, dateKey, day) {
      if (!day) {
        card.innerHTML = `
          <div class="card-kicker">${label}</div>
          <div class="card-date">${formatLongDate(dateKey)}</div>
          <div class="card-main">
            <div>
              <div class="weather-icon" aria-hidden="true">—</div>
              <div class="weather-label">No forecast yet</div>
            </div>
          </div>
        `;
        return;
      }

      const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
      card.innerHTML = `
        <div class="card-kicker">${label}</div>
        <div class="card-date">${formatLongDate(dateKey)}</div>
        <div class="card-main">
          <div>
            <div class="weather-icon" aria-hidden="true">${icon}</div>
            <div class="weather-label">${weatherLabel}</div>
          </div>
          <div class="temps" aria-label="Temperature">
            <div class="temp-max">${formatTemperature(day.max)}</div>
            <div class="temp-min">${formatTemperature(day.min)} low</div>
          </div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>Rain</span><strong>${formatPercent(day.rainProbability)}</strong></div>
          <div class="metric"><span>Precip</span><strong>${formatMillimeters(day.precipitation)}</strong></div>
          <div class="metric"><span>Wind</span><strong>${formatWind(day.wind)}</strong></div>
        </div>
      `;
    }

    function renderCalendar(todayKey) {
      const calendarStartKey = getSundayStart(todayKey);
      const visibleDays = 30;
      const totalCells = Math.ceil(visibleDays / 7) * 7;

      els.monthTitle.textContent = formatRangeTitle(calendarStartKey, addDays(calendarStartKey, visibleDays - 1));
      els.calendarGrid.innerHTML = "";

      for (let cell = 0; cell < totalCells; cell += 1) {
        const isOutside = cell >= visibleDays;
        const cellEl = document.createElement("article");
        cellEl.className = "day-cell";

        if (isOutside) {
          cellEl.classList.add("is-outside");
          cellEl.setAttribute("aria-label", "Outside current month");
          cellEl.innerHTML = `<div class="empty-copy"> </div>`;
          els.calendarGrid.appendChild(cellEl);
          continue;
        }

        const dateKey = addDays(calendarStartKey, cell);
        const dayNumber = Number(dateKey.slice(-2));
        const day = forecastState.byDate.get(dateKey);
        const isToday = dateKey === todayKey;
        if (isToday) cellEl.classList.add("is-today");

        if (day) {
          const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
          cellEl.setAttribute("aria-label", `${formatLongDate(dateKey)}: ${weatherLabel}`);
          cellEl.innerHTML = `
            <div class="day-top">
              <span class="day-number">${dayNumber}</span>
              <span class="day-icon" aria-hidden="true">${icon}</span>
            </div>
            <div class="day-label">${weatherLabel}</div>
            <div class="day-temps">${formatTemperature(day.max)} / ${formatTemperature(day.min)}</div>
            <div class="day-details">
              <span>${formatPercent(day.rainProbability)} rain</span>
              <span>${formatMillimeters(day.precipitation)}</span>
            </div>
          `;
        } else {
          cellEl.classList.add("is-unavailable");
          cellEl.setAttribute("aria-label", `${formatLongDate(dateKey)}: No forecast yet`);
          cellEl.innerHTML = `
            <div class="day-top">
              <span class="day-number">${dayNumber}</span>
            </div>
          `;
        }

        els.calendarGrid.appendChild(cellEl);
      }
    }

    function renderTimeline(todayKey) {
      const days = getTimelineDays(todayKey);

      if (!days.length) {
        els.timelineMeta.textContent = "Forecast unavailable";
        els.timelineStrip.innerHTML = `<div class="empty-state">Forecast unavailable right now.</div>`;
        els.timelineDetail.innerHTML = "";
        return;
      }

      const availableTemps = days
        .filter((entry) => entry.day && Number.isFinite(entry.day.max))
        .map((entry) => entry.day.max);
      const minTemp = Math.min(...availableTemps, 0);
      const maxTemp = Math.max(...availableTemps, 1);

      if (!selectedTimelineKey || !days.some((entry) => entry.dateKey === selectedTimelineKey)) {
        selectedTimelineKey = todayKey;
      }

      els.timelineMeta.textContent = `Next ${days.length} days from today`;
      els.timelineStrip.innerHTML = days.map((entry) => {
        const day = entry.day;
        const isSelected = entry.dateKey === selectedTimelineKey;
        const date = getDateParts(entry.dateKey);
        const [weatherLabel, icon] = day ? weatherCodes[day.code] || ["Unknown", "❔"] : ["No forecast yet", "—"];
        const tempWidth = day && Number.isFinite(day.max)
          ? Math.max(8, Math.round(((day.max - minTemp) / Math.max(1, maxTemp - minTemp)) * 100))
          : 0;

        return `
          <button class="timeline-day ${isSelected ? "is-selected" : ""} ${day ? "" : "is-unavailable"}" type="button" data-date="${entry.dateKey}">
            <span class="timeline-date">${formatCompactWeekday(entry.dateKey)} ${date.day}</span>
            <span class="timeline-icon" aria-hidden="true">${icon}</span>
            <span class="timeline-temp">${day ? `${formatTemperature(day.max)} / ${formatTemperature(day.min)}` : "No forecast"}</span>
            <span>${weatherLabel}</span>
            <span class="temp-track" aria-hidden="true"><span class="temp-fill" style="width: ${tempWidth}%;"></span></span>
          </button>
        `;
      }).join("");

      els.timelineStrip.querySelectorAll(".timeline-day").forEach((button) => {
        button.addEventListener("click", () => {
          selectedTimelineKey = button.dataset.date;
          renderTimeline(todayKey);
        });
      });

      renderTimelineDetail(selectedTimelineKey, forecastState.byDate.get(selectedTimelineKey));
    }

    function renderTimelineDetail(dateKey, day) {
      if (!day) {
        els.timelineDetail.innerHTML = `
          <div class="timeline-detail-top">
            <div>
              <div class="card-kicker">${formatCompactWeekday(dateKey)}</div>
              <h3>${formatLongDate(dateKey)}</h3>
              <div class="weather-label">No forecast yet</div>
            </div>
            <div class="detail-icon" aria-hidden="true">—</div>
          </div>
          <div class="empty-copy">Open-Meteo only provides the available forecast range here, so this day stays intentionally empty.</div>
        `;
        return;
      }

      const [weatherLabel, icon] = weatherCodes[day.code] || ["Unknown", "❔"];
      els.timelineDetail.innerHTML = `
        <div class="timeline-detail-top">
          <div>
            <div class="card-kicker">${formatCompactWeekday(dateKey)}</div>
            <h3>${formatLongDate(dateKey)}</h3>
            <div class="weather-label">${weatherLabel}</div>
          </div>
          <div class="detail-icon" aria-hidden="true">${icon}</div>
        </div>
        <div class="metric-grid">
          <div class="metric"><span>High</span><strong>${formatTemperature(day.max)}</strong></div>
          <div class="metric"><span>Low</span><strong>${formatTemperature(day.min)}</strong></div>
          <div class="metric"><span>Rain</span><strong>${formatPercent(day.rainProbability)}</strong></div>
          <div class="metric"><span>Precip</span><strong>${formatMillimeters(day.precipitation)}</strong></div>
          <div class="metric"><span>Wind</span><strong>${formatWind(day.wind)}</strong></div>
        </div>
      `;
    }

    function getTimelineDays(todayKey) {
      const endDate = forecastState.endDate;
      if (!endDate || endDate < todayKey) return [];

      // Walk forward from today through the end of the available forecast range,
      // so the timeline never shows past dates.
      const days = [];
      let cursor = todayKey;
      for (let guard = 0; guard < 60 && cursor <= endDate; guard += 1) {
        days.push({ dateKey: cursor, day: forecastState.byDate.get(cursor) });
        cursor = addDays(cursor, 1);
      }
      return days;
    }

    function renderLoading() {
      els.todayCard.innerHTML = `<div class="loading-skeleton" style="height: 148px; border-radius: 8px;"></div>`;
      els.tomorrowCard.innerHTML = `<div class="loading-skeleton" style="height: 148px; border-radius: 8px;"></div>`;
      els.dayAfterCard.innerHTML = `<div class="loading-skeleton" style="height: 148px; border-radius: 8px;"></div>`;
      els.monthTitle.textContent = "Loading";
      els.calendarMeta.textContent = "Fetching daily forecast";
      els.calendarGrid.innerHTML = Array.from({ length: 35 }, () => `<div class="day-cell is-empty"><div class="loading-skeleton" style="height: 72px; border-radius: 8px;"></div></div>`).join("");
      els.timelineMeta.textContent = "Fetching daily forecast";
      els.timelineStrip.innerHTML = Array.from({ length: 8 }, () => `<div class="timeline-day loading-skeleton"></div>`).join("");
      els.timelineDetail.innerHTML = `<div class="loading-skeleton" style="height: 120px; border-radius: 8px;"></div>`;
    }

    function renderUnavailableShell() {
      const timezone = locationState.timezone || DEFAULT_LOCATION.timezone;
      const todayParts = getDatePartsInTimeZone(new Date(), timezone);
      forecastState = { timezone, byDate: new Map(), startDate: null, endDate: null };
      renderFeatureCard(els.todayCard, "Today", toDateKey(todayParts.year, todayParts.month, todayParts.day));
      renderFeatureCard(els.tomorrowCard, "Tomorrow", addDays(toDateKey(todayParts.year, todayParts.month, todayParts.day), 1));
      renderFeatureCard(els.dayAfterCard, formatCompactWeekday(addDays(toDateKey(todayParts.year, todayParts.month, todayParts.day), 2)), addDays(toDateKey(todayParts.year, todayParts.month, todayParts.day), 2));
      renderCalendar(toDateKey(todayParts.year, todayParts.month, todayParts.day));
      renderTimeline(toDateKey(todayParts.year, todayParts.month, todayParts.day));
      els.calendarMeta.textContent = "Forecast unavailable";
      els.timelineMeta.textContent = "Forecast unavailable";
    }

    async function handleSearchInput() {
      const query = els.cityInput.value.trim();
      clearTimeout(searchTimer);
      if (query.length < 2) {
        hideSuggestions();
        return;
      }

      searchTimer = setTimeout(async () => {
        try {
          const params = new URLSearchParams({
            name: query,
            count: 5,
            language: "en",
            format: "json"
          });
          const response = await fetch(`${GEOCODING_ENDPOINT}?${params}`);
          if (!response.ok) throw new Error("Geocoding failed");
          const data = await response.json();
          searchResults = data.results || [];
          renderSuggestions(searchResults);
        } catch (error) {
          console.error(error);
          searchResults = [];
          hideSuggestions();
        }
      }, 300);
    }

    async function handleSearchSubmit() {
      const query = els.cityInput.value.trim();
      if (!query) return;

      if (searchResults.length > 0) {
        selectLocation(searchResults[0]);
        return;
      }

      setBusy(true);
      setStatus(`Searching for ${query}...`);
      try {
        const params = new URLSearchParams({
          name: query,
          count: 5,
          language: "en",
          format: "json"
        });
        const response = await fetch(`${GEOCODING_ENDPOINT}?${params}`);
        if (!response.ok) throw new Error("Geocoding failed");
        const data = await response.json();
        searchResults = data.results || [];
        if (!searchResults.length) {
          setStatus("No matching city found. Try a more specific location.", true);
          return;
        }
        selectLocation(searchResults[0]);
      } catch (error) {
        console.error(error);
        setStatus("Could not search for that city. Please try again.", true);
      } finally {
        setBusy(false);
      }
    }

    function renderSuggestions(results) {
      if (!results.length) {
        hideSuggestions();
        return;
      }

      els.suggestions.innerHTML = results.map((result, index) => `
        <button class="suggestion" type="button" data-index="${index}">
          <strong>${escapeHtml(result.name)}</strong>
          <span>${escapeHtml(formatGeoDetail(result))}</span>
        </button>
      `).join("");

      els.suggestions.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          selectLocation(searchResults[index]);
        });
      });

      els.suggestions.hidden = false;
      els.cityInput.setAttribute("aria-expanded", "true");
    }

    function selectLocation(result) {
      locationState = {
        name: result.name,
        country: result.country || "",
        admin1: result.admin1 || "",
        latitude: result.latitude,
        longitude: result.longitude,
        timezone: result.timezone || DEFAULT_LOCATION.timezone
      };
      saveLocation(locationState);
      saveRecentCity(locationState);
      els.cityInput.value = locationState.name;
      setBrand();
      renderRecentCities();
      searchResults = [];
      hideSuggestions();
      renderLoading();
      loadForecast();
    }

    function hideSuggestions() {
      els.suggestions.hidden = true;
      els.suggestions.innerHTML = "";
      els.cityInput.setAttribute("aria-expanded", "false");
    }

    function setBusy(isBusy) {
      els.refreshButton.disabled = isBusy;
      els.searchButton.disabled = isBusy;
      els.refreshButton.textContent = isBusy ? "Loading..." : "↻ Refresh";
    }

    function setBrand() {
      els.brandName.textContent = (locationState.name || "Weather").toUpperCase();
    }

    let clockTimer = null;

    function startClock(timezone) {
      if (clockTimer) clearInterval(clockTimer);
      function tick() {
        const time = new Date().toLocaleTimeString("en-US", {
          timeZone: timezone,
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        els.locationSummary.textContent = `${formatLocation(locationState)} · ${timezone} · ${time}`;
      }
      tick();
      clockTimer = setInterval(tick, 1000);
    }

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function getDatePartsInTimeZone(date, timezone) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: timezone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const partMap = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return {
        year: Number(partMap.year),
        month: Number(partMap.month),
        day: Number(partMap.day)
      };
    }

    function toDateKey(year, month, day) {
      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }

    function addDays(dateKey, amount) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day + amount));
      return toDateKey(date.getUTCFullYear(), date.getUTCMonth() + 1, date.getUTCDate());
    }

    function getDateParts(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return { year, month, day };
    }

    function getSundayStart(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      const weekday = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
      return addDays(dateKey, -weekday);
    }

    function formatLongDate(dateKey) {
      if (!dateKey) return "";
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: "UTC"
      });
    }

    function formatCompactWeekday(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        weekday: "short",
        timeZone: "UTC"
      });
    }

    function formatShortDate(dateKey) {
      if (!dateKey) return "unknown";
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day)).toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        timeZone: "UTC"
      });
    }

    function formatRangeTitle(startKey, endKey) {
      const [startYear, startMonth, startDay] = startKey.split("-").map(Number);
      const [endYear, endMonth, endDay] = endKey.split("-").map(Number);
      const startDate = new Date(Date.UTC(startYear, startMonth - 1, startDay));
      const endDate = new Date(Date.UTC(endYear, endMonth - 1, endDay));

      if (startYear === endYear && startMonth === endMonth) {
        return startDate.toLocaleDateString("en-US", {
          month: "long",
          year: "numeric",
          timeZone: "UTC"
        });
      }

      const startMonthName = startDate.toLocaleDateString("en-US", {
        month: "long",
        timeZone: "UTC"
      });
      const endLabel = endDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric",
        timeZone: "UTC"
      });
      return `${startMonthName}–${endLabel}`;
    }

    function formatTemperature(value) {
      return Number.isFinite(value) ? `${Math.round(value)}°C` : "—";
    }

    function formatPercent(value) {
      return Number.isFinite(value) ? `${Math.round(value)}%` : "—";
    }

    function formatMillimeters(value) {
      return Number.isFinite(value) ? `${Number(value).toFixed(value >= 10 ? 0 : 1)} mm` : "—";
    }

    function formatWind(value) {
      return Number.isFinite(value) ? `${Math.round(value)} km/h` : "—";
    }

    function formatLocation(location) {
      return [location.name, location.country].filter(Boolean).join(", ");
    }

    function formatGeoDetail(result) {
      return [result.admin1, result.country, result.timezone].filter(Boolean).join(" · ");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
